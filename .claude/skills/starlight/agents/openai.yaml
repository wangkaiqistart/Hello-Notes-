name: starlight
description: Starlight - Astro 官方文档主题。配置站点、侧边栏、内置组件、样式定制、页面和 frontmatter；文档需要把本地图片变成远程 OSS 链接时，先使用 oss-image-publisher。
version: '1.1.0'
paradigm: navigator
interface:
  default_prompt: '使用 $starlight 处理 Starlight 文档或配置；先检查项目版本、astro.config.*、AGENTS.md 和内容目录，再按 reference 与官方文档给出可验证的修改。若本地图片需要远程 OSS 链接，先使用 $oss-image-publisher 返回链接。'
