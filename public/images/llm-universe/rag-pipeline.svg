<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title{font:700 42px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .sub{font:500 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#516071}
      .lane{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
      .label{font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#182032}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#546171}
      .note{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2937}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#F8FAFC"/>
  <rect x="34" y="34" width="1132" height="552" rx="24" fill="#FFFFFF" stroke="#D9E2EC"/>
  <text x="70" y="92" class="title">RAG：让模型带着外部资料回答</text>
  <text x="72" y="129" class="sub">RAG 的重点不是让模型“记住”，而是在回答前把相关材料找出来。</text>

  <text x="82" y="204" class="lane">离线建库</text>
  <text x="82" y="392" class="lane">在线问答</text>

  <g filter="url(#shadow)">
    <rect x="205" y="160" width="148" height="86" rx="16" fill="#E6F6F2" stroke="#6BC2B2"/>
    <text x="253" y="195" class="label">文档</text>
    <text x="230" y="224" class="body">PDF / Markdown</text>

    <rect x="395" y="160" width="148" height="86" rx="16" fill="#FFF4D6" stroke="#E2B84D"/>
    <text x="421" y="195" class="label">清洗分块</text>
    <text x="424" y="224" class="body">文本块 + 元数据</text>

    <rect x="585" y="160" width="148" height="86" rx="16" fill="#EAF0FF" stroke="#8AA4F5"/>
    <text x="622" y="195" class="label">Embedding</text>
    <text x="622" y="224" class="body">文本转向量</text>

    <rect x="775" y="160" width="170" height="86" rx="16" fill="#F5EAFF" stroke="#BB8FE8"/>
    <text x="816" y="195" class="label">向量库</text>
    <text x="814" y="224" class="body">索引 + 原文引用</text>

    <rect x="205" y="348" width="148" height="86" rx="16" fill="#E6F6F2" stroke="#6BC2B2"/>
    <text x="253" y="383" class="label">问题</text>
    <text x="238" y="412" class="body">用户输入</text>

    <rect x="395" y="348" width="148" height="86" rx="16" fill="#FFF4D6" stroke="#E2B84D"/>
    <text x="444" y="383" class="label">检索</text>
    <text x="420" y="412" class="body">找相关片段</text>

    <rect x="585" y="348" width="148" height="86" rx="16" fill="#EAF0FF" stroke="#8AA4F5"/>
    <text x="610" y="383" class="label">增强 Prompt</text>
    <text x="614" y="412" class="body">问题 + 上下文</text>

    <rect x="775" y="348" width="148" height="86" rx="16" fill="#FFE9E3" stroke="#EE967B"/>
    <text x="821" y="383" class="label">LLM</text>
    <text x="816" y="412" class="body">基于材料生成</text>

    <rect x="965" y="348" width="148" height="86" rx="16" fill="#ECFDF3" stroke="#6FCF97"/>
    <text x="1012" y="383" class="label">答案</text>
    <text x="1000" y="412" class="body">内容 + 引用</text>
  </g>

  <path d="M355 203H391" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M545 203H581" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M735 203H771" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M355 391H391" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M545 391H581" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M735 391H771" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M925 391H961" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M860 250C860 312 524 301 481 344" stroke="#64748B" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#arrow)"/>

  <rect x="210" y="500" width="780" height="46" rx="14" fill="#F1F5F9"/>
  <text x="290" y="530" class="note">速记：先建库，再检索；先给材料，再让模型回答。</text>
</svg>
