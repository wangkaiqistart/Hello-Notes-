<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title{font:700 42px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .sub{font:500 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#516071}
      .label{font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#182032}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#546171}
      .code{font:700 20px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#1f2937}
      .note{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2937}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#F8FAFC"/>
  <rect x="34" y="34" width="1132" height="552" rx="24" fill="#FFFFFF" stroke="#D9E2EC"/>
  <text x="70" y="92" class="title">LangChain 自定义 Embedding 封装</text>
  <text x="72" y="129" class="sub">当框架没有内置某个厂商接口时，实现统一 Embeddings 接口即可接入。</text>

  <g filter="url(#shadow)">
    <rect x="94" y="205" width="252" height="106" rx="18" fill="#E6F6F2" stroke="#6BC2B2"/>
    <text x="130" y="244" class="code">Embeddings</text>
    <text x="130" y="274" class="body">继承 LangChain 基类</text>

    <rect x="474" y="170" width="252" height="86" rx="18" fill="#FFF4D6" stroke="#E2B84D"/>
    <text x="514" y="207" class="code">embed_query</text>
    <text x="514" y="235" class="body">单个问题转向量</text>

    <rect x="474" y="300" width="252" height="86" rx="18" fill="#EAF0FF" stroke="#8AA4F5"/>
    <text x="505" y="337" class="code">embed_documents</text>
    <text x="505" y="365" class="body">文档列表批量转向量</text>

    <rect x="854" y="205" width="252" height="106" rx="18" fill="#F5EAFF" stroke="#BB8FE8"/>
    <text x="907" y="244" class="label">厂商 API</text>
    <text x="884" y="274" class="body">OpenAI / 智谱 / 千帆等</text>
  </g>

  <path d="M348 258H470" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M348 258C420 258 420 343 470 343" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M728 213C775 213 801 258 850 258" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M728 343C775 343 801 258 850 258" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="182" y="450" width="836" height="46" rx="14" fill="#F1F5F9"/>
  <text x="292" y="480" class="note">速记：继承基类，实现两个方法，内部调用厂商 Embedding API。</text>
</svg>
