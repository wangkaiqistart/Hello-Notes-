<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Agent Tool 三档扩展方式</title>
  <desc id="desc">Tool 扩展分为零代码、轻代码和重代码三档，按复杂度逐步增加实现成本。</desc>
  <style>
    .bg { fill: #171717; }
    .panel { fill: #232323; stroke: #3a3a3a; stroke-width: 2; }
    .accent { fill: #ff8a3d; }
    .title { fill: #f3f4f6; font: 700 42px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .subtitle { fill: #9ca3af; font: 400 21px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .tier { fill: #ff9b52; font: 700 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; text-anchor: middle; }
    .label { fill: #f3f4f6; font: 700 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; text-anchor: middle; }
    .body { fill: #cbd5e1; font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; text-anchor: middle; }
    .small { fill: #9ca3af; font: 400 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; text-anchor: middle; }
    .arrow { stroke: #ff8a3d; stroke-width: 4; fill: none; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="accent"/></marker></defs>
  <rect class="bg" width="1440" height="820" rx="8"/>
  <text class="title" x="56" y="68">Tool 扩展：三档接入方式</text>
  <text class="subtitle" x="56" y="110">优先使用低门槛能力，只有在边界、性能或事务要求出现时才增加代码</text>
  <g transform="translate(70 180)">
    <rect class="panel" width="390" height="500" rx="6"/><rect class="accent" width="390" height="8"/>
    <text class="tier" x="195" y="68">零代码</text><text class="label" x="195" y="120">SKILL.md + 已有 MCP</text>
    <text class="body" x="195" y="190">描述任务、触发条件和工具</text><text class="body" x="195" y="225">复用现成 MCP Server</text>
    <rect fill="#2d2d2d" x="42" y="270" width="306" height="86" rx="4"/><text class="small" x="195" y="305">适合：固定流程、资料处理</text><text class="small" x="195" y="333">成本最低，优先选择</text>
    <text class="body" x="195" y="415">示例：日报汇总 → 推送频道</text>
  </g>
  <g transform="translate(525 180)">
    <rect class="panel" width="390" height="500" rx="6"/><rect class="accent" width="390" height="8"/>
    <text class="tier" x="195" y="68">轻代码</text><text class="label" x="195" y="120">自建 MCP Server</text>
    <text class="body" x="195" y="190">用任意语言封装外部系统</text><text class="body" x="195" y="225">通过 MCP 暴露工具</text>
    <rect fill="#2d2d2d" x="42" y="270" width="306" height="86" rx="4"/><text class="small" x="195" y="305">适合：ERP、CRM、CMDB</text><text class="small" x="195" y="333">外部集成，边界清晰</text>
    <text class="body" x="195" y="415">示例：Python MCP → 查询订单</text>
  </g>
  <g transform="translate(980 180)">
    <rect class="panel" width="390" height="500" rx="6"/><rect class="accent" width="390" height="8"/>
    <text class="tier" x="195" y="68">重代码</text><text class="label" x="195" y="120">Java 原生 Tool</text>
    <text class="body" x="195" y="190">使用 @Tool 注册业务方法</text><text class="body" x="195" y="225">复用事务、权限和 Spring Bean</text>
    <rect fill="#2d2d2d" x="42" y="270" width="306" height="86" rx="4"/><text class="small" x="195" y="305">适合：强类型、事务、性能</text><text class="small" x="195" y="333">核心业务和复杂权限</text>
    <text class="body" x="195" y="415">示例：@Tool queryOrder()</text>
  </g>
  <path class="arrow" d="M460 430 H515"/><path class="arrow" d="M915 430 H970"/>
  <text class="small" x="720" y="745">选择原则：能用 Skill 和现有 MCP，就不写代码；需要业务事务时再使用原生 Tool</text>
</svg>
