<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
  <title id="title">Harness 驱动的 AI Coding 流程</title>
  <desc id="desc">从 constitution 到 spec、plan、tasks，再进入实现和验证，每个阶段都有一致性检查。</desc>
  <style>
    .bg { fill: #171717; }.panel { fill: #232323; stroke: #3a3a3a; stroke-width: 2; }.accent { fill: #ff8a3d; }
    .title { fill: #f3f4f6; font: 700 38px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .label { fill: #ff9b52; font: 700 21px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; text-anchor: middle; }
    .body { fill: #e5e7eb; font: 400 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; text-anchor: middle; }
    .small { fill: #9ca3af; font: 400 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; text-anchor: middle; }
    .arrow { stroke: #ff8a3d; stroke-width: 4; fill: none; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="accent"/></marker></defs>
  <rect class="bg" width="1440" height="600" rx="8"/>
  <text class="title" x="56" y="62">Harness：把 AI Coding 变成可验证的工程流程</text>
  <g transform="translate(50 165)"><rect class="panel" width="225" height="150" rx="6"/><text class="label" x="112" y="52">constitution.md</text><text class="body" x="112" y="94">非协商原则</text><text class="small" x="112" y="124">技术栈、边界、底线</text></g>
  <g transform="translate(310 165)"><rect class="panel" width="225" height="150" rx="6"/><text class="label" x="112" y="52">spec.md</text><text class="body" x="112" y="94">User Story 与验收</text><text class="small" x="112" y="124">目标和可运行结果</text></g>
  <g transform="translate(570 165)"><rect class="panel" width="225" height="150" rx="6"/><text class="label" x="112" y="52">plan.md</text><text class="body" x="112" y="94">模块与数据流</text><text class="small" x="112" y="124">技术取舍和协作关系</text></g>
  <g transform="translate(830 165)"><rect class="panel" width="225" height="150" rx="6"/><text class="label" x="112" y="52">tasks.md</text><text class="body" x="112" y="94">可运行的小任务</text><text class="small" x="112" y="124">接口契约和依赖关系</text></g>
  <g transform="translate(1090 165)"><rect class="panel" width="300" height="150" rx="6"/><text class="label" x="150" y="52">实现 + 验证</text><text class="body" x="150" y="94">代码、测试、构建、Review</text><text class="small" x="150" y="124">一致性分析后再进入下一轮</text></g>
  <path class="arrow" d="M275 240 H300"/><path class="arrow" d="M535 240 H560"/><path class="arrow" d="M795 240 H820"/><path class="arrow" d="M1055 240 H1080"/>
  <rect class="panel" x="260" y="405" width="920" height="78" rx="6"/><text class="body" x="720" y="438">每个阶段都保留上下文、约束和验收证据</text><text class="small" x="720" y="466">发现规格与代码漂移，立即修正，再继续扩展</text>
  <path class="arrow" d="M1240 320 C1240 370 1180 390 1120 405"/>
</svg>
