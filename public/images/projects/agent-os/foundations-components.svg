<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="555" viewBox="0 0 1000 555" role="img" aria-labelledby="title desc">
<title id="title">Agent 的五个组件</title><desc id="desc">Loop 协调模型决策、工具行动与记忆，工具作用于受控环境，结果进入下一次决策。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="1000" height="555" rx="18" fill="white"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="50" y="25" width="900" height="90" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
<text x="500.0" y="64.5" text-anchor="middle" font-size="29" font-weight="700" fill="#334155">Loop · 协调下一步</text>
<text x="500.0" y="100.5" text-anchor="middle" font-size="23" font-weight="400" fill="#64748b">继续 / 完成 / 超限 / 超时 / 中断</text>
<path d="M 500 115 L 500 175" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="185" width="270" height="135" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="175.0" y="231.0" text-anchor="middle" font-size="29" font-weight="700" fill="#334155">LLM · 决策</text>
<text x="175.0" y="267.0" text-anchor="middle" font-size="23" font-weight="400" fill="#64748b">选择工具与参数</text>
<text x="175.0" y="299.0" text-anchor="middle" font-size="23" font-weight="400" fill="#64748b">或形成最终回答</text>
<rect x="365" y="185" width="270" height="135" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
<text x="500.0" y="231.0" text-anchor="middle" font-size="29" font-weight="700" fill="#334155">Tools · 行动</text>
<text x="500.0" y="267.0" text-anchor="middle" font-size="23" font-weight="400" fill="#64748b">执行结构化请求</text>
<text x="500.0" y="299.0" text-anchor="middle" font-size="23" font-weight="400" fill="#64748b">返回结果或错误</text>
<rect x="690" y="185" width="270" height="135" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
<text x="825.0" y="231.0" text-anchor="middle" font-size="29" font-weight="700" fill="#334155">Memory · 状态</text>
<text x="825.0" y="267.0" text-anchor="middle" font-size="23" font-weight="400" fill="#64748b">会话过程</text>
<text x="825.0" y="299.0" text-anchor="middle" font-size="23" font-weight="400" fill="#64748b">可复用的长期事实</text>
<path d="M 310 250 L 365 250" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 635 250 L 690 250" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 825 320 L 825 370 L 175 370 L 175 320" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="500" y="360" text-anchor="middle" font-size="24" font-weight="400" fill="#64748b">观察结果进入下一次决策</text>
<rect x="50" y="415" width="900" height="110" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="500.0" y="464.5" text-anchor="middle" font-size="29" font-weight="700" fill="#334155">Environment · 交互对象与约束</text>
<text x="500.0" y="500.5" text-anchor="middle" font-size="23" font-weight="400" fill="#64748b">文件 / 网络 / 业务服务 / 用户入口 / 凭证与白名单</text>
</g></svg>
