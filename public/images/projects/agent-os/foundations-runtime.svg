<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img" aria-labelledby="title desc">
<title id="title">一次轮次的模型与工具循环</title><desc id="desc">轮次开始后构造 Prompt，ChatModel 返回回答或工具意图；执行工具后回填完整历史，检查直接返回与循环约束。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="1000" height="730" rx="18" fill="white"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="95" y="25" width="600" height="76" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
<text x="395.0" y="57.0" text-anchor="middle" font-size="28" font-weight="700" fill="#334155">开始轮次</text>
<text x="395.0" y="93.0" text-anchor="middle" font-size="23" font-weight="400" fill="#64748b">会话租约 · 轮次记录 · 截止时间</text>
<path d="M 395 101 L 395 135" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="95" y="140" width="600" height="76" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="395.0" y="172.0" text-anchor="middle" font-size="28" font-weight="700" fill="#334155">构造 Prompt</text>
<text x="395.0" y="208.0" text-anchor="middle" font-size="23" font-weight="400" fill="#64748b">指令 + 记忆 + 历史；工具放请求选项</text>
<path d="M 395 216 L 395 255" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="95" y="260" width="600" height="88" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="395.0" y="298.0" text-anchor="middle" font-size="28" font-weight="700" fill="#334155">Provider → ChatModel</text>
<text x="395.0" y="334.0" text-anchor="middle" font-size="23" font-weight="400" fill="#64748b">请求一次模型，记录 llm_calls</text>
<path d="M 695 302 L 770 302" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="735" y="282" text-anchor="middle" font-size="21" font-weight="400" fill="#64748b">回答</text>
<rect x="775" y="260" width="190" height="88" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
<text x="870.0" y="297.5" text-anchor="middle" font-size="27" font-weight="700" fill="#334155">结束轮次</text>
<text x="870.0" y="333.5" text-anchor="middle" font-size="22" font-weight="400" fill="#64748b">保存最终结果</text>
<path d="M 395 348 L 395 410" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="480" y="387" text-anchor="middle" font-size="23" font-weight="400" fill="#64748b">工具意图</text>
<rect x="95" y="415" width="600" height="105" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
<text x="395.0" y="444.5" text-anchor="middle" font-size="26" font-weight="700" fill="#334155">ToolExecutor → ToolCallingManager</text>
<text x="395.0" y="480.5" text-anchor="middle" font-size="23" font-weight="400" fill="#64748b">执行受治理的 ToolCallback</text>
<text x="395.0" y="512.5" text-anchor="middle" font-size="23" font-weight="400" fill="#64748b">记录 tool_invocations</text>
<path d="M 695 607 L 870 607 L 870 348" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="831" y="580" text-anchor="middle" font-size="23" font-weight="400" fill="#64748b">直接返回</text>
<path d="M 395 520 L 395 565" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="95" y="570" width="600" height="76" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="395.0" y="602.0" text-anchor="middle" font-size="28" font-weight="700" fill="#334155">回填完整历史</text>
<text x="395.0" y="638.0" text-anchor="middle" font-size="23" font-weight="400" fill="#64748b">助手工具请求 + 工具结果</text>
<path d="M 95 607 L 40 607 L 40 303 L 95 303" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="500" y="702" text-anchor="middle" font-size="24" font-weight="400" fill="#64748b">每次继续前检查：迭代上限 / 工具限额 / 剩余时间 / 取消 / 租约</text>
</g></svg>
