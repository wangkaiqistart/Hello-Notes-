<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 520" role="img" aria-labelledby="title desc">
  <title id="title">AgentOS 工具调用链</title>
  <desc id="desc">ReActLoop 调用 ProviderService，ChatModel 返回 ChatResponse，ToolExecutor 调用注入的 ToolCallingManager，最终执行 GovernedToolCallback。</desc>
  <style>
    .bg{fill:#0b1220}.card{fill:#111c2e;stroke:#263750;stroke-width:2}.ink{fill:#f8fafc}.muted{fill:#9fb0c7}.accent{fill:#a7f3d0}.accent2{fill:#a5b4fc}.line{stroke:#a7f3d0;stroke-width:3;fill:none;marker-end:url(#arrow)}.thin{stroke:#31435d;stroke-width:1}.gov{fill:#132b2d;stroke:#2d5d5a}.kicker{font:600 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:2px}.title{font:700 40px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.subtitle{font:400 19px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.label{font:650 21px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;text-anchor:middle}.body{font:400 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;text-anchor:middle}.small{font:400 15px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    @media (prefers-color-scheme: light){.bg{fill:#f7f8fc}.card{fill:#fff;stroke:#d6deeb}.ink{fill:#172033}.muted{fill:#5b6980}.accent{fill:#087f68}.accent2{fill:#4f46a5}.line{stroke:#087f68}.thin{stroke:#d6deeb}.gov{fill:#e7f6f1;stroke:#9fd6c7}}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" class="accent"/></marker></defs>
  <rect width="1360" height="520" rx="18" class="bg"/>
  <text x="62" y="58" class="kicker accent">AGENTOS / TOOL EXECUTION</text><text x="62" y="106" class="title ink">工具调用链</text><text x="62" y="140" class="subtitle muted">模型返回请求，应用通过唯一入口执行。</text><line x1="62" y1="174" x2="1298" y2="174" class="thin"/>
  <g transform="translate(62 244)"><rect width="216" height="112" rx="10" class="card"/><text x="108" y="47" class="label ink">ReActLoop</text><text x="108" y="77" class="body muted">迭代调度</text><circle cx="28" cy="28" r="5" class="accent2"/></g>
  <g transform="translate(318 244)"><rect width="216" height="112" rx="10" class="card"/><text x="108" y="47" class="label ink">ProviderService</text><text x="108" y="77" class="body muted">模型调用</text><circle cx="28" cy="28" r="5" class="accent2"/></g>
  <g transform="translate(574 244)"><rect width="216" height="112" rx="10" class="card"/><text x="108" y="47" class="label ink">ChatModel</text><text x="108" y="77" class="body muted">返回 ChatResponse</text><circle cx="28" cy="28" r="5" class="accent2"/></g>
  <g transform="translate(830 244)"><rect width="216" height="112" rx="10" class="card"/><text x="108" y="47" class="label ink">ToolExecutor</text><text x="108" y="77" class="body muted">唯一入口</text><circle cx="28" cy="28" r="5" class="accent2"/></g>
  <g transform="translate(1086 244)"><rect width="216" height="112" rx="10" class="card"/><text x="108" y="47" class="label ink">ToolCallingManager</text><text x="108" y="77" class="body muted">executeToolCalls(...)</text><circle cx="28" cy="28" r="5" class="accent"/></g>
  <path d="M278 300h32M534 300h32M790 300h32M1046 300h32" class="line"/>
  <rect x="62" y="414" width="1240" height="48" rx="8" class="gov"/>
  <text x="682" y="444" class="small accent" text-anchor="middle">GovernedToolCallback · 鉴权 · 限次 · 异常 · 观测</text>
</svg>
