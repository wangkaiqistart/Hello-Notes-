<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">AgentOS 工具调用链</title>
  <desc id="desc">ReActLoop 调用 ProviderService，由 ChatModel 返回 ChatResponse，再由 ToolExecutor 调用注入的 ToolCallingManager，最终执行 GovernedToolCallback。</desc>
  <style>
    .bg { fill: #111827; }
    .card { fill: #1f2937; stroke: #374151; stroke-width: 2; }
    .accent { fill: #5eead4; }
    .heading { fill: #f8fafc; font: 700 40px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .subheading { fill: #94a3b8; font: 400 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .label { fill: #f8fafc; font: 600 23px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; text-anchor: middle; }
    .body { fill: #cbd5e1; font: 400 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; text-anchor: middle; }
    .line { stroke: #5eead4; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    .rule { fill: #334155; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="accent"/>
    </marker>
  </defs>
  <rect class="bg" width="1440" height="560" rx="12"/>
  <text class="heading" x="56" y="68">工具调用链</text>
  <rect class="rule" x="56" y="101" width="1328" height="2"/>
  <text class="subheading" x="56" y="140">模型只返回工具请求，应用通过唯一执行入口完成工具调用</text>

  <g transform="translate(55 235)">
    <rect class="card" width="230" height="130" rx="14"/>
    <text class="label" x="115" y="49">ReActLoop</text>
    <text class="body" x="115" y="84">迭代调度</text>
  </g>
  <g transform="translate(335 235)">
    <rect class="card" width="230" height="130" rx="14"/>
    <text class="label" x="115" y="49">ProviderService</text>
    <text class="body" x="115" y="84">一次模型调用</text>
  </g>
  <g transform="translate(615 235)">
    <rect class="card" width="230" height="130" rx="14"/>
    <text class="label" x="115" y="49">ChatModel</text>
    <text class="body" x="115" y="84">返回 ChatResponse</text>
  </g>
  <g transform="translate(895 235)">
    <rect class="card" width="230" height="130" rx="14"/>
    <text class="label" x="115" y="49">ToolExecutor</text>
    <text class="body" x="115" y="84">统一执行入口</text>
  </g>
  <g transform="translate(1175 235)">
    <rect class="card" width="230" height="130" rx="14"/>
    <text class="label" x="115" y="49">ToolCallingManager</text>
    <text class="body" x="115" y="84">executeToolCalls(...)</text>
  </g>

  <path class="line" d="M285 300 H325"/>
  <path class="line" d="M565 300 H605"/>
  <path class="line" d="M845 300 H885"/>
  <path class="line" d="M1125 300 H1165"/>
  <path class="line" d="M1290 365 V445 H150 V365"/>
  <text class="body" x="720" y="466">GovernedToolCallback：鉴权、次数限制、异常处理和观测在同一条路径生效</text>
</svg>
