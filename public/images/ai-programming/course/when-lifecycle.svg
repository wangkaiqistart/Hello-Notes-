<svg xmlns="http://www.w3.org/2000/svg" width="1928" height="1228" viewBox="0 0 1928 1228" role="img" aria-labelledby="title desc">
<title id="title">延时消息写入与投递流程</title>
<desc id="desc">组件关系与执行流程。文字、矩形、路径与箭头均为可编辑矢量元素；方案差异见配套正文。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="1928" height="1228" rx="0" fill="#f8f9ff" stroke="none" stroke-width="0"/>
<text x="964.0" y="60" xml:space="preserve" font-size="38" fill="#1b3e70" text-anchor="middle" font-weight="700">延时消息写入与投递流程</text>
<text x="964.0" y="100" xml:space="preserve" font-size="23" fill="#888888" text-anchor="middle" font-weight="400">写入：Redis先于返回业务方 · 投递：调度循环只触发，Sink异步执行</text>
<rect x="24" y="128" width="880" height="896" rx="16" fill="#eaf3fc" stroke="#4b94df" stroke-width="3"/>
<rect x="25" y="129" width="878" height="71" rx="14" fill="#4b94df" stroke="none" stroke-width="0"/>
<rect x="25" y="160" width="878" height="40" rx="0" fill="#4b94df" stroke="none" stroke-width="0"/>
<text x="464" y="174" xml:space="preserve" font-size="27" fill="white" text-anchor="middle" font-weight="700">写入流程</text>
<rect x="40" y="217" width="848" height="80" rx="10" fill="white" stroke="#4b94df" stroke-width="1.5"/>
<circle cx="68" cy="257" r="20" fill="#4b94df" stroke="none" stroke-width="2"/>
<text x="68" y="264" xml:space="preserve" font-size="19" fill="white" text-anchor="middle" font-weight="700">1</text>
<text x="100" y="246" xml:space="preserve" font-size="21" fill="#4b94df" text-anchor="start" font-weight="700">业务方 POST /api/v1/messages</text>
<text x="100" y="274" xml:space="preserve" font-size="18" fill="#333333" text-anchor="start" font-weight="400">携带延时时长、Sink配置、消息内容</text>
<path d="M 68,297 L 68,304" fill="none" stroke="#4b94df" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="305" width="848" height="80" rx="10" fill="white" stroke="#4b94df" stroke-width="1.5"/>
<circle cx="68" cy="345" r="20" fill="#4b94df" stroke="none" stroke-width="2"/>
<text x="68" y="352" xml:space="preserve" font-size="19" fill="white" text-anchor="middle" font-weight="700">2</text>
<text x="100" y="334" xml:space="preserve" font-size="21" fill="#4b94df" text-anchor="start" font-weight="700">参数校验</text>
<text x="100" y="362" xml:space="preserve" font-size="18" fill="#333333" text-anchor="start" font-weight="400">延时范围/Sink类型/消息体大小 ≤64KB</text>
<path d="M 68,385 L 68,392" fill="none" stroke="#4b94df" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="393" width="848" height="80" rx="10" fill="white" stroke="#4b94df" stroke-width="1.5"/>
<circle cx="68" cy="433" r="20" fill="#4b94df" stroke="none" stroke-width="2"/>
<text x="68" y="440" xml:space="preserve" font-size="19" fill="white" text-anchor="middle" font-weight="700">3</text>
<text x="100" y="422" xml:space="preserve" font-size="21" fill="#4b94df" text-anchor="start" font-weight="700">生成 message_id</text>
<text x="100" y="450" xml:space="preserve" font-size="18" fill="#333333" text-anchor="start" font-weight="400">Snowflake算法，全局唯一，含节点ID</text>
<path d="M 68,473 L 68,480" fill="none" stroke="#4b94df" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="481" width="848" height="80" rx="10" fill="white" stroke="#4b94df" stroke-width="1.5"/>
<circle cx="68" cy="521" r="20" fill="#4b94df" stroke="none" stroke-width="2"/>
<text x="68" y="528" xml:space="preserve" font-size="19" fill="white" text-anchor="middle" font-weight="700">4</text>
<text x="100" y="510" xml:space="preserve" font-size="21" fill="#4b94df" text-anchor="start" font-weight="700">路由决策</text>
<text x="100" y="538" xml:space="preserve" font-size="18" fill="#333333" text-anchor="start" font-weight="400">一致性Hash(message_id) → 选定 tw-N</text>
<path d="M 68,561 L 68,568" fill="none" stroke="#4b94df" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="569" width="848" height="80" rx="10" fill="white" stroke="#4b94df" stroke-width="1.5"/>
<circle cx="68" cy="609" r="20" fill="#4b94df" stroke="none" stroke-width="2"/>
<text x="68" y="616" xml:space="preserve" font-size="19" fill="white" text-anchor="middle" font-weight="700">5</text>
<text x="100" y="598" xml:space="preserve" font-size="21" fill="#4b94df" text-anchor="start" font-weight="700">gRPC转发（如需）</text>
<text x="100" y="626" xml:space="preserve" font-size="18" fill="#333333" text-anchor="start" font-weight="400">如果tw-N的Master不在本节点，转发过去</text>
<path d="M 68,649 L 68,656" fill="none" stroke="#4b94df" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="657" width="848" height="80" rx="10" fill="white" stroke="#4b94df" stroke-width="1.5"/>
<circle cx="68" cy="697" r="20" fill="#4b94df" stroke="none" stroke-width="2"/>
<text x="68" y="704" xml:space="preserve" font-size="19" fill="white" text-anchor="middle" font-weight="700">6</text>
<text x="100" y="686" xml:space="preserve" font-size="21" fill="#4b94df" text-anchor="start" font-weight="700">Redis持久化</text>
<text x="100" y="714" xml:space="preserve" font-size="18" fill="#333333" text-anchor="start" font-weight="400">Pipeline: SET消息体 + SET时间索引（必须先于返回）</text>
<path d="M 68,737 L 68,744" fill="none" stroke="#4b94df" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="745" width="848" height="80" rx="10" fill="white" stroke="#4b94df" stroke-width="1.5"/>
<circle cx="68" cy="785" r="20" fill="#4b94df" stroke="none" stroke-width="2"/>
<text x="68" y="792" xml:space="preserve" font-size="19" fill="white" text-anchor="middle" font-weight="700">7</text>
<text x="100" y="774" xml:space="preserve" font-size="21" fill="#4b94df" text-anchor="start" font-weight="700">写入内存时间轮</text>
<text x="100" y="802" xml:space="preserve" font-size="18" fill="#333333" text-anchor="start" font-weight="400">插入到对应层和槽位，O(1)复杂度</text>
<path d="M 68,825 L 68,832" fill="none" stroke="#4b94df" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="833" width="848" height="80" rx="10" fill="white" stroke="#4b94df" stroke-width="1.5"/>
<circle cx="68" cy="873" r="20" fill="#4b94df" stroke="none" stroke-width="2"/>
<text x="68" y="880" xml:space="preserve" font-size="19" fill="white" text-anchor="middle" font-weight="700">8</text>
<text x="100" y="862" xml:space="preserve" font-size="21" fill="#4b94df" text-anchor="start" font-weight="700">异步同步Slave</text>
<text x="100" y="890" xml:space="preserve" font-size="18" fill="#333333" text-anchor="start" font-weight="400">gRPC发给Slave，不阻塞业务方返回</text>
<path d="M 68,913 L 68,920" fill="none" stroke="#4b94df" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="921" width="848" height="80" rx="10" fill="white" stroke="#4b94df" stroke-width="1.5"/>
<circle cx="68" cy="961" r="20" fill="#4b94df" stroke="none" stroke-width="2"/>
<text x="68" y="968" xml:space="preserve" font-size="19" fill="white" text-anchor="middle" font-weight="700">9</text>
<text x="100" y="950" xml:space="preserve" font-size="21" fill="#4b94df" text-anchor="start" font-weight="700">返回 message_id</text>
<text x="100" y="978" xml:space="preserve" font-size="18" fill="#333333" text-anchor="start" font-weight="400">status=pending，此时消息已安全落盘</text>
<rect x="944" y="128" width="880" height="896" rx="16" fill="#edf8ee" stroke="#50b467" stroke-width="3"/>
<rect x="945" y="129" width="878" height="71" rx="14" fill="#50b467" stroke="none" stroke-width="0"/>
<rect x="945" y="160" width="878" height="40" rx="0" fill="#50b467" stroke="none" stroke-width="0"/>
<text x="1384" y="174" xml:space="preserve" font-size="27" fill="white" text-anchor="middle" font-weight="700">投递与重试流程</text>
<rect x="960" y="217" width="848" height="80" rx="10" fill="white" stroke="#50b467" stroke-width="1.5"/>
<circle cx="988" cy="257" r="20" fill="#50b467" stroke="none" stroke-width="2"/>
<text x="988" y="264" xml:space="preserve" font-size="19" fill="white" text-anchor="middle" font-weight="700">1</text>
<text x="1020" y="246" xml:space="preserve" font-size="21" fill="#50b467" text-anchor="start" font-weight="700">时间轮tick推进</text>
<text x="1020" y="274" xml:space="preserve" font-size="18" fill="#333333" text-anchor="start" font-weight="400">每秒推进一槽，取出槽内全部消息</text>
<path d="M 988,297 L 988,304" fill="none" stroke="#50b467" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="960" y="305" width="848" height="80" rx="10" fill="white" stroke="#50b467" stroke-width="1.5"/>
<circle cx="988" cy="345" r="20" fill="#50b467" stroke="none" stroke-width="2"/>
<text x="988" y="352" xml:space="preserve" font-size="19" fill="white" text-anchor="middle" font-weight="700">2</text>
<text x="1020" y="334" xml:space="preserve" font-size="21" fill="#50b467" text-anchor="start" font-weight="700">消息降级判断</text>
<text x="1020" y="362" xml:space="preserve" font-size="18" fill="#333333" text-anchor="start" font-weight="400">若在上层时间轮 → 插入下一层重新等待</text>
<path d="M 988,385 L 988,392" fill="none" stroke="#50b467" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="960" y="393" width="848" height="80" rx="10" fill="white" stroke="#50b467" stroke-width="1.5"/>
<circle cx="988" cy="433" r="20" fill="#50b467" stroke="none" stroke-width="2"/>
<text x="988" y="440" xml:space="preserve" font-size="19" fill="white" text-anchor="middle" font-weight="700">3</text>
<text x="1020" y="422" xml:space="preserve" font-size="21" fill="#50b467" text-anchor="start" font-weight="700">到达第一层</text>
<text x="1020" y="450" xml:space="preserve" font-size="18" fill="#333333" text-anchor="start" font-weight="400">进入投递流程，提交到Sink投递器线程池</text>
<path d="M 988,473 L 988,480" fill="none" stroke="#50b467" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="960" y="481" width="848" height="80" rx="10" fill="white" stroke="#50b467" stroke-width="1.5"/>
<circle cx="988" cy="521" r="20" fill="#50b467" stroke="none" stroke-width="2"/>
<text x="988" y="528" xml:space="preserve" font-size="19" fill="white" text-anchor="middle" font-weight="700">4</text>
<text x="1020" y="510" xml:space="preserve" font-size="21" fill="#50b467" text-anchor="start" font-weight="700">异步执行Sink</text>
<text x="1020" y="538" xml:space="preserve" font-size="18" fill="#333333" text-anchor="start" font-weight="400">HTTP POST / Kafka Send，不阻塞调度循环</text>
<path d="M 988,561 L 988,568" fill="none" stroke="#50b467" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="960" y="569" width="848" height="80" rx="10" fill="white" stroke="#50b467" stroke-width="1.5"/>
<circle cx="988" cy="609" r="20" fill="#50b467" stroke="none" stroke-width="2"/>
<text x="988" y="616" xml:space="preserve" font-size="19" fill="white" text-anchor="middle" font-weight="700">5</text>
<text x="1020" y="598" xml:space="preserve" font-size="21" fill="#50b467" text-anchor="start" font-weight="700">投递成功</text>
<text x="1020" y="626" xml:space="preserve" font-size="18" fill="#333333" text-anchor="start" font-weight="400">异步删除Redis消息体和索引，同步Slave删除</text>
<path d="M 988,649 L 988,656" fill="none" stroke="#50b467" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="960" y="657" width="848" height="80" rx="10" fill="white" stroke="#50b467" stroke-width="1.5"/>
<circle cx="988" cy="697" r="20" fill="#50b467" stroke="none" stroke-width="2"/>
<text x="988" y="704" xml:space="preserve" font-size="19" fill="white" text-anchor="middle" font-weight="700">6</text>
<text x="1020" y="686" xml:space="preserve" font-size="21" fill="#50b467" text-anchor="start" font-weight="700">投递失败·可重试</text>
<text x="1020" y="714" xml:space="preserve" font-size="18" fill="#333333" text-anchor="start" font-weight="400">指数退避(30s→1m→2m→4m→8m)，重入时间轮</text>
<path d="M 988,737 L 988,744" fill="none" stroke="#50b467" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="960" y="745" width="848" height="80" rx="10" fill="white" stroke="#50b467" stroke-width="1.5"/>
<circle cx="988" cy="785" r="20" fill="#50b467" stroke="none" stroke-width="2"/>
<text x="988" y="792" xml:space="preserve" font-size="19" fill="white" text-anchor="middle" font-weight="700">7</text>
<text x="1020" y="774" xml:space="preserve" font-size="21" fill="#50b467" text-anchor="start" font-weight="700">投递失败·不可重试</text>
<text x="1020" y="802" xml:space="preserve" font-size="18" fill="#333333" text-anchor="start" font-weight="400">HTTP 4xx等，直接标记 failed，保留Redis备查</text>
<path d="M 988,825 L 988,832" fill="none" stroke="#50b467" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="960" y="833" width="848" height="80" rx="10" fill="white" stroke="#50b467" stroke-width="1.5"/>
<circle cx="988" cy="873" r="20" fill="#50b467" stroke="none" stroke-width="2"/>
<text x="988" y="880" xml:space="preserve" font-size="19" fill="white" text-anchor="middle" font-weight="700">8</text>
<text x="1020" y="862" xml:space="preserve" font-size="21" fill="#50b467" text-anchor="start" font-weight="700">超过5次重试</text>
<text x="1020" y="890" xml:space="preserve" font-size="18" fill="#333333" text-anchor="start" font-weight="400">状态→failed，消息留Redis供运维排查</text>
<path d="M 988,913 L 988,920" fill="none" stroke="#50b467" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="960" y="921" width="848" height="80" rx="10" fill="white" stroke="#50b467" stroke-width="1.5"/>
<circle cx="988" cy="961" r="20" fill="#50b467" stroke="none" stroke-width="2"/>
<text x="988" y="968" xml:space="preserve" font-size="19" fill="white" text-anchor="middle" font-weight="700">9</text>
<text x="1020" y="950" xml:space="preserve" font-size="21" fill="#50b467" text-anchor="start" font-weight="700">取消流程</text>
<text x="1020" y="978" xml:space="preserve" font-size="18" fill="#333333" text-anchor="start" font-weight="400">DELETE API → 定位Master → 内存+Redis删除，O(1)</text>
<rect x="24" y="1052" width="1880" height="136" rx="16" fill="#fff8e8" stroke="#e69d4c" stroke-width="3"/>
<text x="964" y="1090" xml:space="preserve" font-size="24" fill="#8d5000" text-anchor="middle" font-weight="700">两个关键顺序约束（违反则丢消息或重复投递）</text>
<rect x="44" y="1109" width="120" height="36" rx="5" fill="#4b94df" stroke="none" stroke-width="0"/>
<text x="104" y="1134" xml:space="preserve" font-size="18" fill="white" text-anchor="middle" font-weight="700">写入约束</text>
<text x="214" y="1134" xml:space="preserve" font-size="19" fill="#333333" text-anchor="start" font-weight="400">Redis持久化 → 写内存时间轮 → 返回业务方（顺序不可颠倒）</text>
<rect x="984" y="1109" width="120" height="36" rx="5" fill="#50b467" stroke="none" stroke-width="0"/>
<text x="1044" y="1134" xml:space="preserve" font-size="18" fill="white" text-anchor="middle" font-weight="700">投递约束</text>
<text x="1154" y="1134" xml:space="preserve" font-size="19" fill="#333333" text-anchor="start" font-weight="400">Sink投递成功 → 删Redis → 认为完成（中间故障 = 至少一次语义）</text>
</g>
</svg>
