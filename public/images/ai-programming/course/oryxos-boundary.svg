<svg xmlns="http://www.w3.org/2000/svg" width="1274" height="524" viewBox="0 0 1274 524" role="img" aria-labelledby="title desc">
<title id="title">Spring AI 使用边界</title>
<desc id="desc">组件关系与执行流程。文字、矩形、路径与箭头均为可编辑矢量元素；方案差异见配套正文。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="1274" height="524" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="337.5" y="75" xml:space="preserve" font-size="29" fill="#333333" text-anchor="middle" font-weight="700">只用这部分</text>
<text x="936.5" y="75" xml:space="preserve" font-size="29" fill="#333333" text-anchor="middle" font-weight="700">禁用这部分</text>
<rect x="75" y="112" width="525" height="106" rx="28" fill="#e0f5ef" stroke="#50cbaa" stroke-width="2"/>
<text x="337.5" y="161.0" xml:space="preserve" font-size="29" fill="#333333" text-anchor="middle" font-weight="700">Provider 抽象与协议转换</text>
<text x="337.5" y="200.0" xml:space="preserve" font-size="25" fill="#444444" text-anchor="middle" font-weight="400">向各家 LLM 适配</text>
<rect x="75" y="240" width="525" height="106" rx="28" fill="#e0f5ef" stroke="#50cbaa" stroke-width="2"/>
<text x="337.5" y="289.0" xml:space="preserve" font-size="29" fill="#333333" text-anchor="middle" font-weight="700">@Tool 的 Schema 生成</text>
<text x="337.5" y="328.0" xml:space="preserve" font-size="25" fill="#444444" text-anchor="middle" font-weight="400">扫描方法生成 JSON Schema</text>
<rect x="674" y="112" width="525" height="106" rx="28" fill="#f1efe7" stroke="#cbc9bf" stroke-width="2" stroke-dasharray="12 9"/>
<text x="936.5" y="161.0" xml:space="preserve" font-size="29" fill="#333333" text-anchor="middle" font-weight="700">自动 tool 执行</text>
<text x="936.5" y="200.0" xml:space="preserve" font-size="25" fill="#444444" text-anchor="middle" font-weight="400">否则 tool 会被调两次</text>
<rect x="674" y="240" width="525" height="106" rx="28" fill="#f1efe7" stroke="#cbc9bf" stroke-width="2" stroke-dasharray="12 9"/>
<text x="936.5" y="289.0" xml:space="preserve" font-size="29" fill="#333333" text-anchor="middle" font-weight="700">tool 调度由 OryxOS 控制</text>
<text x="936.5" y="328.0" xml:space="preserve" font-size="25" fill="#444444" text-anchor="middle" font-weight="400">ReActLoop 加 ToolExecutor</text>
<text x="637" y="437" xml:space="preserve" font-size="27" fill="#333333" text-anchor="middle" font-weight="700">Spring AI 只做协议适配器和 schema 生成器，不做循环引擎</text>
</g>
</svg>
