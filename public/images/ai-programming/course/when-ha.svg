<svg xmlns="http://www.w3.org/2000/svg" width="1930" height="1346" viewBox="0 0 1930 1346" role="img" aria-labelledby="title desc">
<title id="title">主从复制与故障转移机制</title>
<desc id="desc">组件关系与执行流程。文字、矩形、路径与箭头均为可编辑矢量元素；方案差异见配套正文。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="1930" height="1346" rx="0" fill="#f8f9ff" stroke="none" stroke-width="0"/>
<text x="965.0" y="60" xml:space="preserve" font-size="38" fill="#1b3e70" text-anchor="middle" font-weight="700">主从复制与故障转移机制</text>
<text x="965.0" y="100" xml:space="preserve" font-size="23" fill="#888888" text-anchor="middle" font-weight="400">消息写入主节点 → 同步从节点 → ETCD 监听心跳 → 10s 内完成选主</text>
<rect x="24" y="120" width="860" height="800" rx="16" fill="#eaf3fc" stroke="#4b94df" stroke-width="3"/>
<rect x="25" y="121" width="858" height="16" rx="12" fill="#4b94df" stroke="none" stroke-width="0"/>
<rect x="25" y="130" width="858" height="7" rx="0" fill="#4b94df" stroke="none" stroke-width="0"/>
<text x="454.0" y="168" xml:space="preserve" font-size="28" fill="#4b94df" text-anchor="middle" font-weight="700">正常运行：写入与复制</text>
<text x="244" y="222" xml:space="preserve" font-size="21" fill="#4b94df" text-anchor="middle" font-weight="400">① 客户端写入</text>
<rect x="84" y="230" width="320" height="120" rx="12" fill="white" stroke="#4b94df" stroke-width="3"/>
<rect x="85" y="231" width="318" height="16" rx="10" fill="#4b94df" stroke="none" stroke-width="0"/>
<text x="244" y="280" xml:space="preserve" font-size="26" fill="#4b94df" text-anchor="middle" font-weight="700">Master 节点</text>
<text x="244" y="318" xml:space="preserve" font-size="18" fill="#555555" text-anchor="middle" font-weight="400">接受写入请求 / 广播复制</text>
<rect x="84" y="450" width="320" height="120" rx="12" fill="white" stroke="#50b467" stroke-width="3"/>
<rect x="85" y="451" width="318" height="16" rx="10" fill="#50b467" stroke="none" stroke-width="0"/>
<text x="244" y="500" xml:space="preserve" font-size="26" fill="#50b467" text-anchor="middle" font-weight="700">Slave 节点 A</text>
<text x="244" y="538" xml:space="preserve" font-size="18" fill="#555555" text-anchor="middle" font-weight="400">接受复制 / 只读查询</text>
<rect x="504" y="450" width="320" height="120" rx="12" fill="white" stroke="#50b467" stroke-width="3"/>
<rect x="505" y="451" width="318" height="16" rx="10" fill="#50b467" stroke="none" stroke-width="0"/>
<text x="664" y="500" xml:space="preserve" font-size="26" fill="#50b467" text-anchor="middle" font-weight="700">Slave 节点 B</text>
<text x="664" y="538" xml:space="preserve" font-size="18" fill="#555555" text-anchor="middle" font-weight="400">接受复制 / 只读查询</text>
<path d="M 244,350 L 244,446" fill="none" stroke="#999999" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 404,330 L 664,446" fill="none" stroke="#999999" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="192" y="406" xml:space="preserve" font-size="21" fill="#333333" text-anchor="start" font-weight="400">② 复制</text>
<text x="572" y="406" xml:space="preserve" font-size="21" fill="#333333" text-anchor="start" font-weight="400">② 复制</text>
<path d="M 244,350 L 444,650" fill="none" stroke="#8a58ff" stroke-width="3" stroke-linejoin="round" stroke-dasharray="9 7"/>
<path d="M 244,570 L 444,650" fill="none" stroke="#8a58ff" stroke-width="3" stroke-linejoin="round" stroke-dasharray="9 7"/>
<path d="M 664,570 L 444,650" fill="none" stroke="#8a58ff" stroke-width="3" stroke-linejoin="round" stroke-dasharray="9 7"/>
<rect x="264" y="650" width="360" height="80" rx="12" fill="#f3eeff" stroke="#8a58ff" stroke-width="3"/>
<text x="444" y="681" xml:space="preserve" font-size="23" fill="#8a58ff" text-anchor="middle" font-weight="700">ETCD 心跳监控</text>
<text x="444" y="713" xml:space="preserve" font-size="18" fill="#555555" text-anchor="middle" font-weight="400">TTL=5s，逾期标记宕机</text>
<rect x="64" y="790" width="780" height="100" rx="12" fill="#e9f8ff" stroke="#4b94df" stroke-width="3"/>
<text x="454" y="825" xml:space="preserve" font-size="23" fill="#4b94df" text-anchor="middle" font-weight="700">复制延迟保证</text>
<text x="454" y="863" xml:space="preserve" font-size="18" fill="#555555" text-anchor="middle" font-weight="400">同步复制 &lt; 50ms | 磁盘持久化后 ACK | Slave 积压监控</text>
<rect x="924" y="120" width="980" height="1100" rx="16" fill="#fff0f0" stroke="#e94e50" stroke-width="3"/>
<rect x="925" y="121" width="978" height="16" rx="12" fill="#e94e50" stroke="none" stroke-width="0"/>
<rect x="925" y="130" width="978" height="7" rx="0" fill="#e94e50" stroke="none" stroke-width="0"/>
<text x="1414.0" y="168" xml:space="preserve" font-size="28" fill="#e94e50" text-anchor="middle" font-weight="700">故障转移时序（目标 &lt; 10s）</text>
<path d="M 1024,258 L 1024,1060" fill="none" stroke="#cccccc" stroke-width="2" stroke-linejoin="round"/>
<circle cx="1024" cy="258" r="21" fill="#e94e50" stroke="white" stroke-width="3"/>
<text x="1024" y="264" xml:space="preserve" font-size="12" fill="white" text-anchor="middle" font-weight="700">T=0s</text>
<rect x="1064" y="226" width="800" height="120" rx="12" fill="white" stroke="#e94e50" stroke-width="3"/>
<rect x="1065" y="227" width="798" height="16" rx="10" fill="#e94e50" stroke="none" stroke-width="0"/>
<text x="1104" y="272" xml:space="preserve" font-size="24" fill="#e94e50" text-anchor="start" font-weight="700">Master 宕机</text>
<text x="1104" y="310" xml:space="preserve" font-size="20" fill="#555555" text-anchor="start" font-weight="400">ETCD TTL 租约到期，心跳停止</text>
<circle cx="1024" cy="408" r="21" fill="#e69d4c" stroke="white" stroke-width="3"/>
<text x="1024" y="414" xml:space="preserve" font-size="12" fill="white" text-anchor="middle" font-weight="700">T=5s</text>
<rect x="1064" y="376" width="800" height="120" rx="12" fill="white" stroke="#e69d4c" stroke-width="3"/>
<rect x="1065" y="377" width="798" height="16" rx="10" fill="#e69d4c" stroke="none" stroke-width="0"/>
<text x="1104" y="422" xml:space="preserve" font-size="24" fill="#e69d4c" text-anchor="start" font-weight="700">ETCD 感知</text>
<text x="1104" y="460" xml:space="preserve" font-size="20" fill="#555555" text-anchor="start" font-weight="400">TTL 超时，/nodes/master 键消失</text>
<circle cx="1024" cy="558" r="21" fill="#8a58ff" stroke="white" stroke-width="3"/>
<text x="1024" y="564" xml:space="preserve" font-size="12" fill="white" text-anchor="middle" font-weight="700">T=5.5s</text>
<rect x="1064" y="526" width="800" height="120" rx="12" fill="white" stroke="#8a58ff" stroke-width="3"/>
<rect x="1065" y="527" width="798" height="16" rx="10" fill="#8a58ff" stroke="none" stroke-width="0"/>
<text x="1104" y="572" xml:space="preserve" font-size="24" fill="#8a58ff" text-anchor="start" font-weight="700">Slave 感知</text>
<text x="1104" y="610" xml:space="preserve" font-size="20" fill="#555555" text-anchor="start" font-weight="400">Watch 事件触发，候选人竞争选主</text>
<circle cx="1024" cy="708" r="21" fill="#8a58ff" stroke="white" stroke-width="3"/>
<text x="1024" y="714" xml:space="preserve" font-size="12" fill="white" text-anchor="middle" font-weight="700">T=6s</text>
<rect x="1064" y="676" width="800" height="120" rx="12" fill="white" stroke="#8a58ff" stroke-width="3"/>
<rect x="1065" y="677" width="798" height="16" rx="10" fill="#8a58ff" stroke="none" stroke-width="0"/>
<text x="1104" y="722" xml:space="preserve" font-size="24" fill="#8a58ff" text-anchor="start" font-weight="700">Slave A 当选</text>
<text x="1104" y="760" xml:space="preserve" font-size="20" fill="#555555" text-anchor="start" font-weight="400">抢占 /election/master，成为新 Controller</text>
<circle cx="1024" cy="858" r="21" fill="#50b467" stroke="white" stroke-width="3"/>
<text x="1024" y="864" xml:space="preserve" font-size="12" fill="white" text-anchor="middle" font-weight="700">T=6.5s</text>
<rect x="1064" y="826" width="800" height="120" rx="12" fill="white" stroke="#50b467" stroke-width="3"/>
<rect x="1065" y="827" width="798" height="16" rx="10" fill="#50b467" stroke="none" stroke-width="0"/>
<text x="1104" y="872" xml:space="preserve" font-size="24" fill="#50b467" text-anchor="start" font-weight="700">角色切换</text>
<text x="1104" y="910" xml:space="preserve" font-size="20" fill="#555555" text-anchor="start" font-weight="400">新 Master 开始接受写入，Slave B 重建复制链</text>
<circle cx="1024" cy="1008" r="21" fill="#50b467" stroke="white" stroke-width="3"/>
<text x="1024" y="1014" xml:space="preserve" font-size="12" fill="white" text-anchor="middle" font-weight="700">T=8s</text>
<rect x="1064" y="976" width="800" height="120" rx="12" fill="white" stroke="#50b467" stroke-width="3"/>
<rect x="1065" y="977" width="798" height="16" rx="10" fill="#50b467" stroke="none" stroke-width="0"/>
<text x="1104" y="1022" xml:space="preserve" font-size="24" fill="#50b467" text-anchor="start" font-weight="700">服务恢复</text>
<text x="1104" y="1060" xml:space="preserve" font-size="20" fill="#555555" text-anchor="start" font-weight="400">对外服务正常，完成故障转移</text>
<rect x="944" y="1130" width="940" height="72" rx="12" fill="#ffe7e7" stroke="#e94e50" stroke-width="3"/>
<text x="1414" y="1160" xml:space="preserve" font-size="22" fill="#c90000" text-anchor="middle" font-weight="700">故障转移 SLA</text>
<text x="1414" y="1189" xml:space="preserve" font-size="18" fill="#666666" text-anchor="middle" font-weight="400">TTL(5s) + Watch延迟(0.5s) + 选主(0.5s) + 切换(1s) = 约7s &lt; 10s目标</text>
<rect x="24" y="1240" width="1880" height="88" rx="16" fill="#f3eeff" stroke="#8a58ff" stroke-width="3"/>
<text x="964" y="1275" xml:space="preserve" font-size="23" fill="#6f36d9" text-anchor="middle" font-weight="700">数据一致性保证：写入 Master 后同步复制，ACK 前不响应客户端 → 零丢失保证</text>
<text x="964" y="1308" xml:space="preserve" font-size="20" fill="#777777" text-anchor="middle" font-weight="400">脑裂防护：ETCD 强一致选主，同一时刻只有一个节点持有 /election/master 锁</text>
</g>
</svg>
