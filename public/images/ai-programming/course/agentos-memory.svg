<svg xmlns="http://www.w3.org/2000/svg" width="1274" height="600" viewBox="0 0 1274 600" role="img" aria-labelledby="title desc">
<title id="title">AgentOS 记忆层统一门面</title>
<desc id="desc">组件关系与执行流程。文字、矩形、路径与箭头均为可编辑矢量元素；方案差异见配套正文。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="1274" height="600" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/>
<rect x="468" y="68" width="338" height="94" rx="28" fill="#f1efe7" stroke="#cbc9bf" stroke-width="2"/>
<text x="637.0" y="125.0" xml:space="preserve" font-size="29" fill="#333333" text-anchor="middle" font-weight="400">ReAct 循环</text>
<path d="M 637,162 L 637,240" fill="none" stroke="#99998c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="660" y="213" xml:space="preserve" font-size="24" fill="#333333" text-anchor="start" font-weight="400">只调一个接口</text>
<rect x="430" y="244" width="414" height="108" rx="28" fill="#e0f5ef" stroke="#50cbaa" stroke-width="2"/>
<text x="637.0" y="294.0" xml:space="preserve" font-size="29" fill="#333333" text-anchor="middle" font-weight="700">MemoryService</text>
<text x="637.0" y="333.0" xml:space="preserve" font-size="21" fill="#444444" text-anchor="middle" font-weight="400">三层统一门面，对外只暴露一个接口</text>
<path d="M 537,352 L 356,446" fill="none" stroke="#99998c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="356" y="410" xml:space="preserve" font-size="24" fill="#333333" text-anchor="middle" font-weight="400">委托</text>
<rect x="150" y="450" width="412" height="110" rx="28" fill="#f1efe7" stroke="#cbc9bf" stroke-width="2"/>
<text x="356.0" y="501.0" xml:space="preserve" font-size="29" fill="#333333" text-anchor="middle" font-weight="700">SessionManager</text>
<text x="356.0" y="540.0" xml:space="preserve" font-size="25" fill="#444444" text-anchor="middle" font-weight="400">会话记忆（SQLite）</text>
<path d="M 737,352 L 918,446" fill="none" stroke="#99998c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="918" y="410" xml:space="preserve" font-size="24" fill="#333333" text-anchor="middle" font-weight="400">委托</text>
<rect x="712" y="450" width="412" height="110" rx="28" fill="#f1efe7" stroke="#cbc9bf" stroke-width="2"/>
<text x="918.0" y="501.0" xml:space="preserve" font-size="29" fill="#333333" text-anchor="middle" font-weight="700">LongTermMemory</text>
<text x="918.0" y="540.0" xml:space="preserve" font-size="25" fill="#444444" text-anchor="middle" font-weight="400">长期记忆（MEMORY.md）</text>
</g>
</svg>
