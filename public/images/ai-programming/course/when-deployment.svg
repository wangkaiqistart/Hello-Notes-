<text x="496" y="427" xml:space="preserve" font-size="17" fill="#888888" text-anchor="middle" font-weight="400">port: 8081 / 9091</text>
<text x="496" y="455" xml:space="preserve" font-size="17" fill="#888888" text-anchor="middle" font-weight="400">时间轮 · 状态机</text>
<text x="496" y="483" xml:space="preserve" font-size="17" fill="#888888" text-anchor="middle" font-weight="400">复制 · Sink 分发</text>
<text x="496" y="511" xml:space="preserve" font-size="17" fill="#888888" text-anchor="middle" font-weight="400">./data/node-1:/data</text>
