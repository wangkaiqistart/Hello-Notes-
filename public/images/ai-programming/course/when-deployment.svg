<text x="196" y="511" xml:space="preserve" font-size="17" fill="#888888" text-anchor="middle" font-weight="400">./data/node-0:/data</text>
<path d="M 342,436 L 349,436" fill="none" stroke="#888888" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 496,326 L 496,300" fill="none" stroke="#8a58ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="9 7"/>
<rect x="350" y="326" width="292" height="220" rx="14" fill="white" stroke="#50b467" stroke-width="4"/>
