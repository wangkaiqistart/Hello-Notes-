<svg xmlns="http://www.w3.org/2000/svg" width="2110" height="1272" viewBox="0 0 2110 1272" role="img" aria-labelledby="title desc">
<title id="title">部署拓扑：3节点集群</title>
<desc id="desc">组件关系与执行流程。文字、矩形、路径与箭头均为可编辑矢量元素；方案差异见配套正文。</desc>
