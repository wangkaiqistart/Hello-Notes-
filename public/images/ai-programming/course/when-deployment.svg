<text x="510" y="234" xml:space="preserve" font-size="23" fill="#8a58ff" text-anchor="middle" font-weight="700">ETCD 集群（3节点）</text>
<text x="510" y="264" xml:space="preserve" font-size="18" fill="#666666" text-anchor="middle" font-weight="400">etcd-0:2379 etcd-1:2379 etcd-2:2379 — Raft 共识</text>
<path d="M 196,326 L 196,300" fill="none" stroke="#8a58ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="9 7"/>
