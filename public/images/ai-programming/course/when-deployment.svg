<text x="196" y="369" xml:space="preserve" font-size="23" fill="#4b94df" text-anchor="middle" font-weight="700">when-node-0</text>
<text x="196" y="399" xml:space="preserve" font-size="17" fill="#888888" text-anchor="middle" font-weight="400">Master（初始）</text>
<text x="196" y="427" xml:space="preserve" font-size="17" fill="#888888" text-anchor="middle" font-weight="400">port: 8080 / 9090</text>
<text x="196" y="455" xml:space="preserve" font-size="17" fill="#888888" text-anchor="middle" font-weight="400">时间轮 · 状态机</text>
