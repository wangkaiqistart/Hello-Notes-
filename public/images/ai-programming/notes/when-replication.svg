<svg xmlns="http://www.w3.org/2000/svg" width="820" height="754" viewBox="0 0 820 754" role="img" aria-labelledby="title desc">
<title id="title">异步副本与恢复路径</title>
<desc id="desc">组件关系与执行流程。文字、矩形、路径与箭头均为可编辑矢量元素；方案差异见配套正文。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="820" height="754" rx="0" fill="#f8f9ff" stroke="none" stroke-width="0"/>
<text x="410.0" y="60" xml:space="preserve" font-size="38" fill="#1b3e70" text-anchor="middle" font-weight="700">异步副本与恢复路径</text>
<text x="410.0" y="100" xml:space="preserve" font-size="23" fill="#888888" text-anchor="middle" font-weight="400">Redis 保存权威状态，内存副本减少恢复时间</text>
<rect x="58" y="140" width="704" height="112" rx="18" fill="#eaf3fc" stroke="#4b94df" stroke-width="2"/>
<rect x="58" y="160" width="6" height="72" rx="3" fill="#4b94df" stroke="none" stroke-width="0"/>
<text x="84" y="179" xml:space="preserve" font-size="27" fill="#1b3e70" text-anchor="start" font-weight="700">01  写入 Redis</text>
<text x="84" y="214" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">先持久化消息和状态，写入失败则不返回成功</text>
<path d="M 410,254 L 410,280" fill="none" stroke="#96a4b4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="58" y="286" width="704" height="112" rx="18" fill="#f3eeff" stroke="#8a58ff" stroke-width="2"/>
<rect x="58" y="306" width="6" height="72" rx="3" fill="#8a58ff" stroke="none" stroke-width="0"/>
<text x="84" y="325" xml:space="preserve" font-size="27" fill="#1b3e70" text-anchor="start" font-weight="700">02  加入 Master 时间轮</text>
<text x="84" y="360" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">接收、调度并投递当前时间轮的消息</text>
<path d="M 410,400 L 410,426" fill="none" stroke="#96a4b4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="58" y="432" width="704" height="112" rx="18" fill="#edf8ee" stroke="#50b467" stroke-width="2"/>
<rect x="58" y="452" width="6" height="72" rx="3" fill="#50b467" stroke="none" stroke-width="0"/>
<text x="84" y="471" xml:space="preserve" font-size="27" fill="#1b3e70" text-anchor="start" font-weight="700">03  异步同步到 Slave</text>
<text x="84" y="506" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">同步不阻塞业务返回；失败后标记 out-of-sync</text>
<path d="M 410,546 L 410,572" fill="none" stroke="#96a4b4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="58" y="578" width="704" height="112" rx="18" fill="#fff8e8" stroke="#e69d4c" stroke-width="2"/>
<rect x="58" y="598" width="6" height="72" rx="3" fill="#e69d4c" stroke="none" stroke-width="0"/>
<text x="84" y="617" xml:space="preserve" font-size="27" fill="#1b3e70" text-anchor="start" font-weight="700">04  故障后重建与接管</text>
<text x="84" y="652" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">补齐 Redis 中的未完成消息，再恢复调度</text>
</g>
</svg>
