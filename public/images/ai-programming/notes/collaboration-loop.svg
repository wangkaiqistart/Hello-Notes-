<svg xmlns="http://www.w3.org/2000/svg" width="900" height="920" viewBox="0 0 900 920" role="img" aria-labelledby="title desc">
<title id="title">人机协作的交付闭环</title>
<desc id="desc">组件关系与执行流程。文字、矩形、路径与箭头均为可编辑矢量元素；方案差异见配套正文。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="900" height="920" rx="0" fill="#f8f9ff" stroke="none" stroke-width="0"/>
<text x="450.0" y="60" xml:space="preserve" font-size="38" fill="#1b3e70" text-anchor="middle" font-weight="700">人机协作的交付闭环</text>
<text x="450.0" y="100" xml:space="preserve" font-size="23" fill="#888888" text-anchor="middle" font-weight="400">人确定目标与边界，AI 执行，独立检查提供证据</text>
<rect x="55" y="140" width="360" height="140" rx="18" fill="#eaf3fc" stroke="#4b94df" stroke-width="2"/>
<rect x="55" y="160" width="6" height="100" rx="3" fill="#4b94df" stroke="none" stroke-width="0"/>
<text x="81" y="179" xml:space="preserve" font-size="27" fill="#1b3e70" text-anchor="start" font-weight="700">明确目标</text>
<text x="81" y="214" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">价值、范围、优先级</text>
<text x="81" y="245" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">写出可检查的验收标准</text>
<rect x="485" y="140" width="360" height="140" rx="18" fill="#f3eeff" stroke="#8a58ff" stroke-width="2"/>
<rect x="485" y="160" width="6" height="100" rx="3" fill="#8a58ff" stroke="none" stroke-width="0"/>
<text x="511" y="179" xml:space="preserve" font-size="27" fill="#1b3e70" text-anchor="start" font-weight="700">准备上下文</text>
<text x="511" y="214" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">接口、规则、依赖与环境</text>
<text x="511" y="245" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">明确权限和文件范围</text>
<rect x="485" y="345" width="360" height="140" rx="18" fill="#edf8ee" stroke="#50b467" stroke-width="2"/>
<rect x="485" y="365" width="6" height="100" rx="3" fill="#50b467" stroke="none" stroke-width="0"/>
<text x="511" y="384" xml:space="preserve" font-size="27" fill="#1b3e70" text-anchor="start" font-weight="700">拆成小任务</text>
<text x="511" y="419" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">按依赖顺序安排</text>
<text x="511" y="450" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">每项都能独立验收</text>
<rect x="55" y="345" width="360" height="140" rx="18" fill="#eaf3fc" stroke="#4b94df" stroke-width="2"/>
<rect x="55" y="365" width="6" height="100" rx="3" fill="#4b94df" stroke="none" stroke-width="0"/>
<text x="81" y="384" xml:space="preserve" font-size="27" fill="#1b3e70" text-anchor="start" font-weight="700">AI 执行</text>
<text x="81" y="419" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">按任务修改与验证</text>
<text x="81" y="450" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">记录变更和运行结果</text>
<rect x="55" y="550" width="360" height="140" rx="18" fill="#fff8e8" stroke="#e69d4c" stroke-width="2"/>
<rect x="55" y="570" width="6" height="100" rx="3" fill="#e69d4c" stroke="none" stroke-width="0"/>
<text x="81" y="589" xml:space="preserve" font-size="27" fill="#1b3e70" text-anchor="start" font-weight="700">独立验证</text>
<text x="81" y="624" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">测试、构建与 Review</text>
<text x="81" y="655" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">核查失败和风险边界</text>
<rect x="485" y="550" width="360" height="140" rx="18" fill="#edf8ee" stroke="#50b467" stroke-width="2"/>
<rect x="485" y="570" width="6" height="100" rx="3" fill="#50b467" stroke="none" stroke-width="0"/>
<text x="511" y="589" xml:space="preserve" font-size="27" fill="#1b3e70" text-anchor="start" font-weight="700">人工放行</text>
<text x="511" y="624" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">决定是否交付</text>
<text x="511" y="655" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">监控、回滚与经验沉淀</text>
<path d="M 420,210 L 480,210" fill="none" stroke="#96a4b4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 665,285 L 665,340" fill="none" stroke="#96a4b4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 480,415 L 420,415" fill="none" stroke="#96a4b4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 235,490 L 235,545" fill="none" stroke="#96a4b4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 420,620 L 480,620" fill="none" stroke="#96a4b4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="55" y="770" width="790" height="105" rx="16" fill="#fff0f0" stroke="#e94e50" stroke-width="2"/>
<text x="450" y="809" xml:space="preserve" font-size="26" fill="#a73237" text-anchor="middle" font-weight="700">未通过：收集证据 → 修正任务 → 有界重试</text>
<text x="450" y="849" xml:space="preserve" font-size="22" fill="#333333" text-anchor="middle" font-weight="400">需求不清、超出权限或超过预算时停止，交由人处理</text>
<path d="M 235,694 L 235,752 L 450,752 L 450,766" fill="none" stroke="#e94e50" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="450" y="602" xml:space="preserve" font-size="20" fill="#50b467" text-anchor="middle" font-weight="400">通过</text>
</g>
</svg>
