<svg xmlns="http://www.w3.org/2000/svg" width="820" height="900" viewBox="0 0 820 900" role="img" aria-labelledby="title desc">
<title id="title">从观察信号到工具决策</title>
<desc id="desc">组件关系与执行流程。文字、矩形、路径与箭头均为可编辑矢量元素；方案差异见配套正文。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="820" height="900" rx="0" fill="#f8f9ff" stroke="none" stroke-width="0"/>
<text x="410.0" y="60" xml:space="preserve" font-size="38" fill="#1b3e70" text-anchor="middle" font-weight="700">从观察信号到工具决策</text>
<text x="410.0" y="100" xml:space="preserve" font-size="23" fill="#888888" text-anchor="middle" font-weight="400">让选型经过自己的任务与失败验证</text>
<rect x="58" y="140" width="704" height="112" rx="18" fill="#eaf3fc" stroke="#4b94df" stroke-width="2"/>
<rect x="58" y="160" width="6" height="72" rx="3" fill="#4b94df" stroke="none" stroke-width="0"/>
<text x="84" y="179" xml:space="preserve" font-size="27" fill="#1b3e70" text-anchor="start" font-weight="700">01  观察信号</text>
<text x="84" y="214" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">宣传、榜单、项目发布；只建立候选清单</text>
<path d="M 410,254 L 410,280" fill="none" stroke="#96a4b4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="58" y="286" width="704" height="112" rx="18" fill="#f3eeff" stroke="#8a58ff" stroke-width="2"/>
<rect x="58" y="306" width="6" height="72" rx="3" fill="#8a58ff" stroke="none" stroke-width="0"/>
<text x="84" y="325" xml:space="preserve" font-size="27" fill="#1b3e70" text-anchor="start" font-weight="700">02  核对官方信息</text>
<text x="84" y="360" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">检查仓库、文档、版本、支持范围和维护情况</text>
<path d="M 410,400 L 410,426" fill="none" stroke="#96a4b4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="58" y="432" width="704" height="112" rx="18" fill="#edf8ee" stroke="#50b467" stroke-width="2"/>
<rect x="58" y="452" width="6" height="72" rx="3" fill="#50b467" stroke="none" stroke-width="0"/>
<text x="84" y="471" xml:space="preserve" font-size="27" fill="#1b3e70" text-anchor="start" font-weight="700">03  执行真实任务</text>
<text x="84" y="506" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">用最小任务检查能力、约束和验收结果</text>
<path d="M 410,546 L 410,572" fill="none" stroke="#96a4b4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="58" y="578" width="704" height="112" rx="18" fill="#fff8e8" stroke="#e69d4c" stroke-width="2"/>
<rect x="58" y="598" width="6" height="72" rx="3" fill="#e69d4c" stroke="none" stroke-width="0"/>
<text x="84" y="617" xml:space="preserve" font-size="27" fill="#1b3e70" text-anchor="start" font-weight="700">04  记录失败与成本</text>
<text x="84" y="652" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">记录成功率、延迟、调用费用和维护成本</text>
<path d="M 410,692 L 410,718" fill="none" stroke="#96a4b4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="58" y="724" width="704" height="112" rx="18" fill="#eaf3fc" stroke="#4b94df" stroke-width="2"/>
<rect x="58" y="744" width="6" height="72" rx="3" fill="#4b94df" stroke="none" stroke-width="0"/>
<text x="84" y="763" xml:space="preserve" font-size="27" fill="#1b3e70" text-anchor="start" font-weight="700">05  作出项目决策</text>
<text x="84" y="798" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">比较收益与风险；保留替换和回退方式</text>
</g>
</svg>
