<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000" role="img" aria-labelledby="title desc">
<title id="title">When 节点内的数据流</title>
<desc id="desc">组件关系与执行流程。文字、矩形、路径与箭头均为可编辑矢量元素；方案差异见配套正文。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="900" height="1000" rx="0" fill="#f8f9ff" stroke="none" stroke-width="0"/>
<text x="450.0" y="60" xml:space="preserve" font-size="38" fill="#1b3e70" text-anchor="middle" font-weight="700">When 节点内的数据流</text>
<text x="450.0" y="100" xml:space="preserve" font-size="23" fill="#888888" text-anchor="middle" font-weight="400">协调、持久化、内存调度与异步投递分别承担职责</text>
<rect x="170" y="140" width="670" height="100" rx="18" fill="#eaf3fc" stroke="#4b94df" stroke-width="2"/>
<rect x="170" y="160" width="6" height="60" rx="3" fill="#4b94df" stroke="none" stroke-width="0"/>
<text x="196" y="179" xml:space="preserve" font-size="25" fill="#1b3e70" text-anchor="start" font-weight="700">HTTP API / gRPC API</text>
<text x="196" y="214" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">统一接收外部请求与内部转发</text>
<rect x="170" y="285" width="670" height="100" rx="18" fill="#f3eeff" stroke="#8a58ff" stroke-width="2"/>
<rect x="170" y="305" width="6" height="60" rx="3" fill="#8a58ff" stroke="none" stroke-width="0"/>
<text x="196" y="324" xml:space="preserve" font-size="25" fill="#1b3e70" text-anchor="start" font-weight="700">接入与路由 → 消息服务 → 状态机</text>
<text x="196" y="359" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">按时间轮归属处理请求和状态变更</text>
<rect x="170" y="500" width="670" height="100" rx="18" fill="#fff0f0" stroke="#e94e50" stroke-width="2"/>
<rect x="170" y="520" width="6" height="60" rx="3" fill="#e94e50" stroke="none" stroke-width="0"/>
<text x="196" y="539" xml:space="preserve" font-size="25" fill="#1b3e70" text-anchor="start" font-weight="700">Redis 持久化</text>
<text x="196" y="574" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">保存消息与状态，成功后才进入调度</text>
<rect x="170" y="645" width="670" height="100" rx="18" fill="#edf8ee" stroke="#50b467" stroke-width="2"/>
<rect x="170" y="665" width="6" height="60" rx="3" fill="#50b467" stroke="none" stroke-width="0"/>
<text x="196" y="684" xml:space="preserve" font-size="25" fill="#1b3e70" text-anchor="start" font-weight="700">多层时间轮</text>
<text x="196" y="719" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">内存索引与到期触发</text>
<rect x="170" y="790" width="670" height="100" rx="18" fill="#fff8e8" stroke="#e69d4c" stroke-width="2"/>
<rect x="170" y="810" width="6" height="60" rx="3" fill="#e69d4c" stroke="none" stroke-width="0"/>
<text x="196" y="829" xml:space="preserve" font-size="25" fill="#1b3e70" text-anchor="start" font-weight="700">Due Handler → Sink SPI</text>
<text x="196" y="864" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">取得投递权，异步投递并更新状态</text>
<path d="M 505,244 L 505,280" fill="none" stroke="#96a4b4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 505,389 L 505,495" fill="none" stroke="#96a4b4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 505,604 L 505,640" fill="none" stroke="#96a4b4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 505,749 L 505,785" fill="none" stroke="#96a4b4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="25" y="400" width="275" height="76" rx="14" fill="#eaf3fc" stroke="#4b94df" stroke-width="2"/>
<text x="162" y="432" xml:space="preserve" font-size="24" fill="#1b3e70" text-anchor="middle" font-weight="700">ETCD 协调</text>
<text x="162" y="461" xml:space="preserve" font-size="19" fill="#333333" text-anchor="middle" font-weight="400">节点、角色与时间轮归属</text>
<path d="M 300,438 L 350,438 L 350,390" fill="none" stroke="#4b94df" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
</g>
</svg>
