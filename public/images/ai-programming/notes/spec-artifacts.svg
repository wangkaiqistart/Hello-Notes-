<svg xmlns="http://www.w3.org/2000/svg" width="820" height="955" viewBox="0 0 820 955" role="img" aria-labelledby="title desc">
<title id="title">规格产物的约束与追踪</title>
<desc id="desc">组件关系与执行流程。文字、矩形、路径与箭头均为可编辑矢量元素；方案差异见配套正文。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="820" height="955" rx="0" fill="#f8f9ff" stroke="none" stroke-width="0"/>
<text x="410.0" y="60" xml:space="preserve" font-size="38" fill="#1b3e70" text-anchor="middle" font-weight="700">规格产物的约束与追踪</text>
<text x="410.0" y="100" xml:space="preserve" font-size="23" fill="#888888" text-anchor="middle" font-weight="400">每一层都需要审查，变更后主动核对下游</text>
<rect x="58" y="140" width="704" height="112" rx="18" fill="#eaf3fc" stroke="#4b94df" stroke-width="2"/>
<rect x="58" y="160" width="6" height="72" rx="3" fill="#4b94df" stroke="none" stroke-width="0"/>
<text x="84" y="179" xml:space="preserve" font-size="27" fill="#1b3e70" text-anchor="start" font-weight="700">01  工程原则 · constitution</text>
<text x="84" y="214" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">质量、安全、兼容性与不可随意改变的约定</text>
<path d="M 410,254 L 410,280" fill="none" stroke="#96a4b4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="58" y="286" width="704" height="112" rx="18" fill="#f3eeff" stroke="#8a58ff" stroke-width="2"/>
<rect x="58" y="306" width="6" height="72" rx="3" fill="#8a58ff" stroke="none" stroke-width="0"/>
<text x="84" y="325" xml:space="preserve" font-size="27" fill="#1b3e70" text-anchor="start" font-weight="700">02  行为规格 · spec</text>
<text x="84" y="360" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">用户场景、边界、失败行为与可判定的验收</text>
<path d="M 410,400 L 410,426" fill="none" stroke="#96a4b4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="58" y="432" width="704" height="112" rx="18" fill="#edf8ee" stroke="#50b467" stroke-width="2"/>
<rect x="58" y="452" width="6" height="72" rx="3" fill="#50b467" stroke="none" stroke-width="0"/>
<text x="84" y="471" xml:space="preserve" font-size="27" fill="#1b3e70" text-anchor="start" font-weight="700">03  技术计划 · plan</text>
<text x="84" y="506" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">实现方案、接口、依赖和关键取舍</text>
<path d="M 410,546 L 410,572" fill="none" stroke="#96a4b4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="58" y="578" width="704" height="112" rx="18" fill="#fff8e8" stroke="#e69d4c" stroke-width="2"/>
<rect x="58" y="598" width="6" height="72" rx="3" fill="#e69d4c" stroke="none" stroke-width="0"/>
<text x="84" y="617" xml:space="preserve" font-size="27" fill="#1b3e70" text-anchor="start" font-weight="700">04  任务清单 · tasks</text>
<text x="84" y="652" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">小增量、依赖顺序、文件范围与检查步骤</text>
<path d="M 410,692 L 410,718" fill="none" stroke="#96a4b4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="58" y="724" width="704" height="112" rx="18" fill="#eaf3fc" stroke="#4b94df" stroke-width="2"/>
<rect x="58" y="744" width="6" height="72" rx="3" fill="#4b94df" stroke="none" stroke-width="0"/>
<text x="84" y="763" xml:space="preserve" font-size="27" fill="#1b3e70" text-anchor="start" font-weight="700">05  实现与验证证据</text>
<text x="84" y="798" xml:space="preserve" font-size="22" fill="#536477" text-anchor="start" font-weight="400">代码、测试和运行记录；反向核对规格与计划</text>
<text x="410" y="920" xml:space="preserve" font-size="21" fill="#777777" text-anchor="middle" font-weight="400">勾选任务只表示进度，完成需要证据</text>
</g>
</svg>
