<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">ChatClient 配置合并与 Advisor 调用链</title>
<desc id="desc">默认模型选项与本次选项合并，和消息一起组成 ChatClientRequest。请求经过两层 Advisor 的调用前处理，由 ChatModelCallAdvisor 调用 ChatModel 和 AI 模型；响应按相反方向经过调用后处理。Advisor 数量仅为示意。</desc>
<defs><marker id="arrow" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="9" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#ec8a08" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="620" fill="white"/>
<g font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
<rect x="350" y="20" width="820" height="535" rx="18" fill="#e5f3ff" stroke="none" stroke-width="1.7"/>
<text x="750" y="56" text-anchor="middle" font-size="27" font-weight="400" fill="#006bc5">Advisor 1</text>
<rect x="465" y="82" width="685" height="450" rx="18" fill="#e5f3ff" stroke="white" stroke-width="1.7"/>
<text x="795" y="117" text-anchor="middle" font-size="27" font-weight="400" fill="#006bc5">Advisor 2</text>
<rect x="585" y="142" width="545" height="365" rx="18" fill="#e5f3ff" stroke="white" stroke-width="1.7"/>
<text x="855" y="178" text-anchor="middle" font-size="26" font-weight="400" fill="#006bc5">ChatModelCallAdvisor</text>
<rect x="700" y="211" width="408" height="265" rx="20" fill="white" stroke="#0670ce" stroke-width="1.7"/>
<text x="903" y="250" text-anchor="middle" font-size="27" font-weight="400" fill="#006bc5">ChatModel</text>
<rect x="20" y="62" width="264" height="89" rx="5" fill="white" stroke="#0670ce" stroke-width="1.7"/>
<text x="152" y="95" text-anchor="middle" font-size="23" font-weight="400" fill="#006bc5">默认模型选项</text>
<text x="152" y="126" text-anchor="middle" font-size="20" font-weight="400" fill="#006bc5">defaultOptions(...)</text>
<rect x="20" y="194" width="264" height="89" rx="5" fill="white" stroke="#0670ce" stroke-width="1.7"/>
<text x="152" y="227" text-anchor="middle" font-size="23" font-weight="400" fill="#006bc5">本次模型选项</text>
<text x="152" y="258" text-anchor="middle" font-size="21" font-weight="400" fill="#006bc5">options(...)</text>
<path d="M 152 151 L 152 194" fill="none" stroke="#ec8a08" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="232" y="179" text-anchor="middle" font-size="20" font-weight="400" fill="#006bc5">合并</text>
<rect x="20" y="330" width="264" height="148" rx="5" fill="white" stroke="#0670ce" stroke-width="1.7"/>
<text x="152" y="365" text-anchor="middle" font-size="23" font-weight="400" fill="#006bc5">ChatClientRequest</text>
<rect x="32" y="384" width="240" height="81" rx="0" fill="white" stroke="#8ab8e4" stroke-width="1.7"/>
<text x="152" y="411" text-anchor="middle" font-size="20" font-weight="400" fill="#006bc5">Prompt：消息列表</text>
<text x="152" y="444" text-anchor="middle" font-size="19" font-weight="400" fill="#006bc5">ChatOptions：合并结果</text>
<path d="M 152 283 L 152 330" fill="none" stroke="#ec8a08" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 284 365 L 315 365 L 315 313 L 370 313" fill="none" stroke="#ec8a08" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="370" y="291" width="83" height="46" rx="5" fill="white" stroke="#0670ce" stroke-width="1.7"/>
<text x="411.5" y="321" text-anchor="middle" font-size="20" font-weight="400" fill="#006bc5">调用前</text>
<rect x="485" y="291" width="83" height="46" rx="5" fill="white" stroke="#0670ce" stroke-width="1.7"/>
<text x="526.5" y="321" text-anchor="middle" font-size="20" font-weight="400" fill="#006bc5">调用前</text>
<path d="M 453 313 L 485 313" fill="none" stroke="#ec8a08" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 568 313 L 718 313" fill="none" stroke="#ec8a08" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="718" y="284" width="124" height="62" rx="5" fill="white" stroke="#0670ce" stroke-width="1.7"/>
<text x="780" y="309" text-anchor="middle" font-size="20" font-weight="400" fill="#006bc5">转换为</text>
<text x="780" y="334" text-anchor="middle" font-size="20" font-weight="400" fill="#006bc5">模型请求</text>
<rect x="945" y="284" width="134" height="134" rx="16" fill="#ffe88c" stroke="none" stroke-width="1.7"/>
<text x="1012" y="342" text-anchor="middle" font-size="24" font-weight="400" fill="#675000">AI 模型</text>
<text x="1012" y="377" text-anchor="middle" font-size="22" font-weight="400" fill="#675000">LLM</text>
<path d="M 842 313 L 945 313" fill="none" stroke="#ec8a08" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 945 390 L 842 390" fill="none" stroke="#ec8a08" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="718" y="365" width="124" height="62" rx="5" fill="white" stroke="#0670ce" stroke-width="1.7"/>
<text x="780" y="390" text-anchor="middle" font-size="20" font-weight="400" fill="#006bc5">转换为</text>
<text x="780" y="415" text-anchor="middle" font-size="20" font-weight="400" fill="#006bc5">模型响应</text>
<path d="M 718 445 L 568 445" fill="none" stroke="#ec8a08" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 718 396 L 697 396 L 697 445" fill="none" stroke="#ec8a08" stroke-width="2.5"/>
<rect x="370" y="423" width="83" height="46" rx="5" fill="white" stroke="#0670ce" stroke-width="1.7"/>
<text x="411.5" y="453" text-anchor="middle" font-size="20" font-weight="400" fill="#006bc5">调用后</text>
<rect x="485" y="423" width="83" height="46" rx="5" fill="white" stroke="#0670ce" stroke-width="1.7"/>
<text x="526.5" y="453" text-anchor="middle" font-size="20" font-weight="400" fill="#006bc5">调用后</text>
<path d="M 485 445 L 453 445" fill="none" stroke="#ec8a08" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 370 445 L 312 445 L 312 518 L 152 518" fill="none" stroke="#ec8a08" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="152" y="552" text-anchor="middle" font-size="23" font-weight="400" fill="#006bc5">返回响应</text>
<text x="600" y="595" text-anchor="middle" font-size="21" font-weight="400" fill="#406078">请求依次进入 Advisor，响应按相反方向返回。</text></g>
</svg>
