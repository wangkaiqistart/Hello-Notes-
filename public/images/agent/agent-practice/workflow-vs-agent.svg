<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="720" viewBox="0 0 1220 720" role="img" aria-labelledby="title desc">
  <title id="title">Workflow 和 Agent 的区别</title>
  <desc id="desc">对比固定流程的 Workflow 和动态决策的 Agent。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10" />
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 760 39px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 400 19px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 26; filter: url(#shadow); }
      .label { font: 760 27px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 400 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .step { fill: #eef6ff; stroke: #2563eb; stroke-width: 2; rx: 18; }
      .agent { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 22; }
      .router { fill: #ecfdf5; stroke: #16a34a; stroke-width: 2; rx: 18; }
      .out { fill: #111827; stroke: #111827; stroke-width: 2; rx: 18; }
      .step-text { font: 700 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e3a8a; }
      .agent-text { font: 760 21px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #92400e; }
      .out-text { font: 700 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .line { fill: none; stroke: #475569; stroke-width: 2.8; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2.6; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1220" height="720" />
  <text class="title" x="70" y="72">Workflow 和 Agent 的区别</text>
  <text class="subtitle" x="70" y="108">Workflow 更像预设流程，Agent 更像可以根据状态动态决策的执行者。</text>

  <rect class="panel" x="70" y="160" width="500" height="470" />
  <text class="label" x="116" y="214">Workflow：流程先定好</text>
  <text class="small" x="116" y="250">适合步骤明确、路径固定的任务。</text>

  <rect class="step" x="128" y="310" width="132" height="72" />
  <text class="step-text" x="166" y="354">翻译</text>
  <rect class="step" x="320" y="310" width="132" height="72" />
  <text class="step-text" x="356" y="354">总结</text>
  <rect class="step" x="224" y="440" width="132" height="72" />
  <text class="step-text" x="260" y="484">润色</text>
  <rect class="out" x="224" y="548" width="132" height="54" />
  <text class="out-text" x="262" y="582">输出</text>

  <path class="line" d="M260 346 H314" />
  <path class="line" d="M386 382 C384 418 354 438 322 454" />
  <path class="line" d="M290 512 V542" />

  <rect class="panel" x="650" y="160" width="500" height="470" />
  <text class="label" x="696" y="214">Agent：边想边决定</text>
  <text class="small" x="696" y="250">适合开放式、需要探索和工具选择的任务。</text>

  <rect class="agent" x="840" y="312" width="150" height="96" />
  <text class="agent-text" x="882" y="354">Agent</text>
  <text class="small" x="872" y="382">观察后决策</text>

  <rect class="router" x="710" y="480" width="128" height="64" />
  <text class="step-text" x="746" y="520">工具 A</text>
  <rect class="router" x="898" y="500" width="128" height="64" />
  <text class="step-text" x="934" y="540">工具 B</text>
  <rect class="router" x="1012" y="382" width="98" height="58" />
  <text class="step-text" x="1036" y="418">输出</text>

  <path class="line" d="M720 360 H834" />
  <path class="dash" d="M916 408 C880 460 840 482 790 500" />
  <path class="dash" d="M990 362 C1036 360 1062 366 1060 376" />
  <path class="dash" d="M962 500 C940 462 924 432 918 414" />
  <path class="dash" d="M774 480 C790 436 824 410 846 386" />

  <text class="small" x="704" y="618">关键区别：Agent 可以根据中间结果继续选择工具或结束。</text>
</svg>
