<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="720" viewBox="0 0 1220 720" role="img" aria-labelledby="title desc">
  <title id="title">Agent 工具调用循环</title>
  <desc id="desc">展示 LLM 如何生成工具调用 JSON，执行器调用工具后将结果回填给模型。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.11" />
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 760 39px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 400 19px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2.2; rx: 22; filter: url(#shadow); }
      .llm { fill: #eef6ff; stroke: #2563eb; }
      .json { fill: #fff7ed; stroke: #ea580c; }
      .tool { fill: #ecfdf5; stroke: #16a34a; }
      .obs { fill: #f5f3ff; stroke: #7c3aed; }
      .final { fill: #111827; stroke: #111827; }
      .label { font: 750 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 400 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .code { font: 650 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill: #7c2d12; }
      .final-label { font: 750 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .final-text { font: 500 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .line { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #0f766e; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrow); }
      .tag { fill: #e0f2fe; stroke: #38bdf8; rx: 14; }
      .tag-text { font: 750 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #075985; }
    </style>
  </defs>

  <rect class="bg" width="1220" height="720" />
  <text class="title" x="70" y="72">工具调用不是模型自己执行工具</text>
  <text class="subtitle" x="70" y="108">LLM 先生成工具调用意图，运行时执行工具，再把观察结果回填给模型进入下一轮推理。</text>

  <rect class="node" x="70" y="250" width="188" height="110" />
  <text class="label" x="114" y="300">用户输入</text>
  <text class="text" x="104" y="332">提出任务或问题</text>

  <rect class="node llm" x="328" y="230" width="216" height="150" />
  <text class="label" x="386" y="282">LLM 推理</text>
  <text class="text" x="362" y="318">判断是否需要工具</text>
  <text class="text" x="362" y="346">生成下一步动作</text>

  <rect class="node json" x="606" y="214" width="250" height="182" />
  <text class="label" x="650" y="260">工具调用意图</text>
  <text class="code" x="636" y="296">{</text>
  <text class="code" x="660" y="324">"name": "search",</text>
  <text class="code" x="660" y="352">"args": {"q": "..."}</text>
  <text class="code" x="636" y="380">}</text>

  <rect class="node tool" x="922" y="250" width="218" height="110" />
  <text class="label" x="966" y="300">工具执行器</text>
  <text class="text" x="958" y="332">真正调用 Tool / API</text>

  <rect class="node obs" x="612" y="494" width="244" height="112" />
  <text class="label" x="660" y="544">观察结果</text>
  <text class="text" x="646" y="576">工具返回值进入上下文</text>

  <rect class="final" x="328" y="500" width="216" height="100" rx="22" />
  <text class="final-label" x="384" y="548">最终输出</text>
  <text class="final-text" x="370" y="578">满足条件后回答用户</text>

  <path class="line" d="M258 305 H322" />
  <path class="line" d="M544 305 H600" />
  <path class="line" d="M856 305 H916" />
  <path class="line" d="M1031 360 C1026 458 940 540 862 550" />
  <path class="loop" d="M612 550 C496 548 436 468 436 386" />
  <path class="line" d="M436 380 V494" />

  <rect class="tag" x="630" y="414" width="190" height="34" />
  <text class="tag-text" x="656" y="436">ToolMessage：工具结果回填</text>
</svg>
