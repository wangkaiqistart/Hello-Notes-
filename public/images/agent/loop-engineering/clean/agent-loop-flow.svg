<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Agent Loop 核心流程</title>
  <desc id="desc">展示智能体从用户任务进入观察、思考、行动、反馈、判断终止条件的循环。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f2937" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 42px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 400 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2.5; rx: 18; }
      .input { fill: #dff6ff; }
      .loop { fill: #ecfdf5; }
      .decision { fill: #fff7ed; }
      .done { fill: #ede9fe; }
      .label { font: 700 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .note { font: 400 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .arrow { fill: none; stroke: #1f2937; stroke-width: 3; marker-end: url(#arrow); }
      .loop-arrow { fill: none; stroke: #0f766e; stroke-width: 3.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1280" height="720" />
  <text class="title" x="80" y="82">Agent Loop 核心流程</text>
  <text class="subtitle" x="80" y="118">把 LLM 的推理能力放进 while 循环，让智能体能反复观察、思考、行动和接收反馈。</text>

  <rect class="box input" x="88" y="250" width="180" height="92" />
  <text class="label" x="132" y="292">用户任务</text>
  <text class="note" x="118" y="320">输入目标或请求</text>

  <rect class="box loop" x="340" y="160" width="210" height="92" />
  <text class="label" x="397" y="202">观察</text>
  <text class="note" x="380" y="230">获取环境状态</text>

  <rect class="box loop" x="690" y="160" width="210" height="92" />
  <text class="label" x="747" y="202">思考</text>
  <text class="note" x="722" y="230">推理下一步计划</text>

  <rect class="box loop" x="690" y="386" width="210" height="92" />
  <text class="label" x="747" y="428">行动</text>
  <text class="note" x="722" y="456">调用工具或 API</text>

  <rect class="box loop" x="340" y="386" width="210" height="92" />
  <text class="label" x="397" y="428">反馈</text>
  <text class="note" x="372" y="456">写入结果和记忆</text>

  <path class="arrow" d="M268 296 H330" />
  <path class="arrow" d="M550 206 H680" />
  <path class="arrow" d="M795 252 V374" />
  <path class="arrow" d="M690 432 H560" />

  <path class="loop-arrow" d="M445 386 V310 C445 280 470 272 495 286 L605 350 C630 365 650 350 650 322 V264" />
  <text class="note" x="462" y="356">未完成则继续循环</text>

  <polygon class="decision" points="1010,268 1130,342 1010,416 890,342" stroke="#1f2937" stroke-width="2.5" />
  <text class="label" x="962" y="334">是否完成</text>
  <text class="note" x="955" y="362">终止条件 / 步数</text>
  <path class="arrow" d="M900 432 C970 432 1010 410 1010 418" />

  <rect class="box done" x="1040" y="496" width="170" height="82" />
  <text class="label" x="1078" y="532">任务完成</text>
  <text class="note" x="1074" y="558">输出最终结果</text>
  <path class="arrow" d="M1044 397 C1110 430 1125 462 1125 486" />

  <text class="note" x="932" y="465">否：回到观察</text>
  <path class="loop-arrow" d="M890 342 C770 600 400 590 445 486" />
</svg>
