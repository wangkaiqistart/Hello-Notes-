<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">从 LLM 到 Loop Engineering 的概念递进</title>
  <desc id="desc">展示 LLM、工具绑定、Agent、Agent Loop 和 Loop Engineering 之间的能力递进关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f2937" />
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f766e" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 40px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 400 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .card { fill: #ffffff; stroke: #1f2937; stroke-width: 2.3; rx: 20; }
      .llm { fill: #e0f2fe; }
      .tools { fill: #fef3c7; }
      .agent { fill: #dcfce7; }
      .loop { fill: #ede9fe; }
      .engineering { fill: #fee2e2; }
      .label { font: 700 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 400 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .small { font: 500 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .arrow { fill: none; stroke: #1f2937; stroke-width: 3; marker-end: url(#arrow); }
      .loop-arrow { fill: none; stroke: #0f766e; stroke-width: 3.2; marker-end: url(#arrow-green); }
      .note { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.8; rx: 16; }
      .note-title { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .note-text { font: 400 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="720" />
  <text class="title" x="70" y="76">从 LLM 到 Loop Engineering</text>
  <text class="subtitle" x="70" y="112">先分清模型、工具、Agent 和循环的边界，再理解 Loop Engineering 在工程上管控什么。</text>

  <rect class="card llm" x="70" y="210" width="198" height="150" />
  <text class="label" x="118" y="254">LLM</text>
  <text class="text" x="102" y="292">推理 / 生成</text>
  <text class="small" x="100" y="326">没有天然持久记忆</text>

  <rect class="card tools" x="330" y="210" width="198" height="150" />
  <text class="label" x="374" y="254">工具绑定</text>
  <text class="text" x="362" y="292">告诉模型</text>
  <text class="small" x="360" y="326">有哪些工具和参数</text>

  <rect class="card agent" x="590" y="210" width="198" height="150" />
  <text class="label" x="652" y="254">Agent</text>
  <text class="text" x="622" y="292">执行工具</text>
  <text class="small" x="620" y="326">把结果交回模型</text>

  <rect class="card loop" x="850" y="210" width="198" height="150" />
  <text class="label" x="890" y="254">Agent Loop</text>
  <text class="text" x="890" y="292">反复调用</text>
  <text class="small" x="880" y="326">思考、行动、观察</text>

  <rect class="card engineering" x="1040" y="450" width="188" height="132" />
  <text class="label" x="1062" y="492">Loop 工程</text>
  <text class="text" x="1070" y="528">目标 / 触发</text>
  <text class="text" x="1070" y="558">验证 / 退出</text>

  <path class="arrow" d="M268 285 H320" />
  <path class="arrow" d="M528 285 H580" />
  <path class="arrow" d="M788 285 H840" />
  <path class="arrow" d="M980 360 C1036 392 1085 414 1115 442" />

  <rect class="note" x="332" y="406" width="456" height="96" />
  <text class="note-title" x="362" y="442">关键边界</text>
  <text class="note-text" x="362" y="472">工具绑定只让模型“知道该调什么”；真正执行工具、保存状态、</text>
  <text class="note-text" x="362" y="496">把结果送回模型的是 Agent 或外部运行时。</text>

  <text class="label" x="184" y="602">ReAct 循环</text>
  <text class="text" x="184" y="636">思考 -> 行动 -> 观察 -> 再思考，直到解决问题或触发退出条件。</text>

  <path class="loop-arrow" d="M870 430 C760 610 454 610 610 360" />
  <text class="small" x="670" y="590">工具结果成为下一轮推理上下文</text>
</svg>
