<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Loop Engineering 爆发的三个条件</title>
  <desc id="desc">展示 MCP、上下文管理与 Maker-Checker 三项能力共同成熟，支撑 Loop Engineering 进入生产级。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 40px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 400 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .card { stroke: #1f2937; stroke-width: 2.5; rx: 22; }
      .a { fill: #dbeafe; }
      .b { fill: #dcfce7; }
      .c { fill: #fef3c7; }
      .base { fill: #ede9fe; stroke: #1f2937; stroke-width: 2.5; rx: 18; }
      .label { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 400 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .small { font: 500 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
    </style>
  </defs>
  <rect class="bg" width="1280" height="720" />
  <text class="title" x="80" y="86">为什么 Loop Engineering 到 2026 才爆发</text>
  <text class="subtitle" x="80" y="122">不是因为之前没人想做，而是三个生产级条件在 2025-2026 陆续成熟。</text>

  <rect class="card a" x="90" y="210" width="330" height="300" />
  <text class="label" x="132" y="268">MCP / 工具连接</text>
  <text class="text" x="132" y="318">Agent 能稳定调用外部系统。</text>
  <text class="small" x="132" y="366">数据库、文件系统、API、GitHub、</text>
  <text class="small" x="132" y="396">支付、消息、工单都可以通过统一</text>
  <text class="small" x="132" y="426">协议接入。</text>

  <rect class="card b" x="475" y="210" width="330" height="300" />
  <text class="label" x="517" y="268">上下文与记忆</text>
  <text class="text" x="517" y="318">Loop 跑得起，也记得住事。</text>
  <text class="small" x="517" y="366">Prompt Caching 降低成本，</text>
  <text class="small" x="517" y="396">checkpointer 和 store 保存跨轮</text>
  <text class="small" x="517" y="426">状态与长期经验。</text>

  <rect class="card c" x="860" y="210" width="330" height="300" />
  <text class="label" x="902" y="268">Maker-Checker</text>
  <text class="text" x="902" y="318">干活的人不能给自己打分。</text>
  <text class="small" x="902" y="366">Maker 执行，Checker 只读验证，</text>
  <text class="small" x="902" y="396">用权限隔离和客观标准降低</text>
  <text class="small" x="902" y="426">自评偏差。</text>

  <rect class="base" x="238" y="570" width="804" height="78" />
  <text class="label" x="374" y="620">三者同时成熟，Loop 才能长期、自主、可验证地运行</text>
</svg>
