<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">从 Prompt Engineering 到 Loop Engineering</title>
  <desc id="desc">用上下两条流程泳道对比 Prompt Engineering 中人手动推进每一轮，以及 Loop Engineering 中人设计循环、系统自动发现任务、调度 Agent、验证结果并修正重试。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f2937" />
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f766e" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 40px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .caption { font: 500 19px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .lane-old { fill: #fff7f7; stroke: #fecaca; stroke-width: 2; rx: 24; }
      .lane-new { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 2; rx: 24; }
      .section { font: 700 27px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .badge-old { fill: #fee2e2; stroke: #ef4444; stroke-width: 1.6; rx: 14; }
      .badge-new { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.6; rx: 14; }
      .badge-text { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .box { stroke: #1f2937; stroke-width: 2.3; rx: 16; }
      .old { fill: #fee2e2; }
      .human { fill: #dbeafe; }
      .loop { fill: #dcfce7; }
      .verify { fill: #fef3c7; }
      .result { fill: #ede9fe; }
      .retry { fill: #ffedd5; }
      .label { font: 700 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 400 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .small { font: 500 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .muted { font: 400 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6b7280; }
      .arrow { fill: none; stroke: #1f2937; stroke-width: 3; marker-end: url(#arrow); }
      .loop-arrow { fill: none; stroke: #0f766e; stroke-width: 3.4; marker-end: url(#arrow-teal); }
      .divider { stroke: #cbd5e1; stroke-width: 1.4; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="760" />
  <text class="title" x="70" y="72">从 Prompt Engineering 到 Loop Engineering</text>
  <text class="caption" x="70" y="108">内容没有变成“不要 Prompt”，而是把 Prompt 放进循环系统里自动生成、调度、验证和修正。</text>

  <rect class="lane-old" x="62" y="142" width="1156" height="222" />
  <text class="section" x="92" y="190">旧模式：人手动推进每一轮</text>
  <rect class="badge-old" x="470" y="162" width="190" height="34" />
  <text class="badge-text" x="496" y="184">Prompt Engineering</text>

  <rect class="box old" x="96" y="232" width="168" height="82" />
  <text class="label" x="136" y="267">人</text>
  <text class="text" x="126" y="292">写 Prompt</text>

  <rect class="box old" x="334" y="232" width="178" height="82" />
  <text class="label" x="374" y="267">LLM</text>
  <text class="text" x="370" y="292">回答一次</text>

  <rect class="box old" x="582" y="232" width="202" height="82" />
  <text class="label" x="640" y="267">人</text>
  <text class="text" x="622" y="292">阅读和判断</text>

  <rect class="box old" x="854" y="232" width="220" height="82" />
  <text class="label" x="910" y="267">再写 Prompt</text>
  <text class="text" x="894" y="292">不满意就继续追问</text>

  <path class="arrow" d="M264 273 H324" />
  <path class="arrow" d="M512 273 H572" />
  <path class="arrow" d="M784 273 H844" />
  <path class="arrow" d="M1074 273 C1126 208 250 198 180 222" />
  <text class="muted" x="94" y="344">瓶颈：每轮依赖人判断，复杂任务要手动拆解，长对话容易丢失上下文。</text>

  <line class="divider" x1="70" y1="388" x2="1210" y2="388" />

  <rect class="lane-new" x="62" y="418" width="1156" height="276" />
  <text class="section" x="92" y="466">新模式：人设计 Loop，让系统自动运行</text>
  <rect class="badge-new" x="510" y="438" width="178" height="34" />
  <text class="badge-text" x="536" y="460">Loop Engineering</text>

  <rect class="box human" x="92" y="520" width="220" height="92" />
  <text class="label" x="132" y="556">人设计 Loop</text>
  <text class="text" x="122" y="584">目标 / 触发 / 验证 / 退出</text>

  <rect class="box loop" x="382" y="520" width="170" height="92" />
  <text class="label" x="424" y="556">发现任务</text>
  <text class="text" x="418" y="584">满足触发条件</text>

  <rect class="box loop" x="622" y="520" width="180" height="92" />
  <text class="label" x="664" y="556">调度 Agent</text>
  <text class="text" x="650" y="584">执行一轮工作</text>

  <rect class="box verify" x="872" y="520" width="180" height="92" />
  <text class="label" x="918" y="556">自动验证</text>
  <text class="text" x="914" y="584">通过 / 不通过</text>

  <rect class="box result" x="1086" y="486" width="112" height="64" />
  <text class="label" x="1120" y="516">通过</text>
  <text class="small" x="1102" y="538">记录并继续</text>

  <rect class="box retry" x="860" y="638" width="250" height="44" />
  <text class="small" x="894" y="665">不通过：修正重试或升级人工</text>

  <path class="arrow" d="M312 566 H372" />
  <path class="arrow" d="M552 566 H612" />
  <path class="arrow" d="M802 566 H862" />
  <path class="arrow" d="M1052 550 C1072 530 1078 520 1080 518" />
  <path class="loop-arrow" d="M958 612 V632" />
  <path class="loop-arrow" d="M860 660 C760 660 710 638 710 622" />
  <text class="muted" x="92" y="660">核心：人不再逐轮催促，而是设计循环的边界，让系统自己发现、执行、验证和收敛。</text>
</svg>
